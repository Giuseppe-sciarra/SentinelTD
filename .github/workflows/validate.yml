name: Validate source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/i18n.test.cjs
      - run: python tests/check_release.py
      - run: pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends php-cli php-zip
      - run: php tests/connector_removal.test.php
      - run: php tests/connector_mode.test.php
      - run: php tests/connector_autoupdates.test.php
