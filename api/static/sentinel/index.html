<!doctype html>
<html lang="it" data-project="panopticon-lite">
<head>
  <meta charset="utf-8">
  <script src="/static/i18n/catalog.js"></script>
  <script src="/static/i18n/i18n.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinel TD</title>
  <link id="app-favicon" rel="icon" href="/api/branding/favicon">
  <!-- font e librerie in locale: nessuna dipendenza da CDN esterni -->
  <link rel="stylesheet" href="/static/vendor/inter.css">
  <link rel="stylesheet" href="/static/sentinel/sentinel.css">
  <script src="/static/sentinel/app.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>

  <link rel="stylesheet" href="/static/i18n/i18n.css">
</head>
<body x-data="sentinel()" x-cloak>

<!-- ===================== LOGIN ===================== -->
<template x-if="!token">
  <div class="login">
    <div class="box card">
      <div class="brand"><img class="brand-logo" :src="brand.logo_url" alt="Tastiere Digitali"><div class="brand-app"><div class="name">Sentinel TD</div><div class="by">monitoraggio siti</div></div></div>
      <template x-if="step==='pwd'">
        <form @submit.prevent="login()">
          <div class="field"><label>Utente</label><input class="input" x-model="user" autocomplete="username" autofocus></div>
          <div class="field"><label>Password</label><input class="input" type="password" x-model="pwd" autocomplete="current-password"></div>
          <div class="msg err" x-show="err" x-text="err"></div>
          <button class="btn primary" style="width:100%;justify-content:center" type="submit">Entra</button>
        </form>
      </template>
      <template x-if="step==='2fa'">
        <div>
          <p class="mut small">Verifica in due passaggi</p>
          <template x-if="methods.includes('totp')">
            <form @submit.prevent="verifyTotp()">
              <div class="field"><label>Codice authenticator</label><input class="input mono" x-model="code" inputmode="numeric" autofocus placeholder="123456"></div>
              <button class="btn primary" style="width:100%;justify-content:center" type="submit">Verifica</button>
            </form>
          </template>
          <template x-if="methods.includes('passkey')">
            <button class="btn" style="width:100%;justify-content:center;margin-top:10px" @click="loginPasskey()">Usa passkey</button>
          </template>
          <div class="msg err" x-show="err" x-text="err"></div>
          <button class="btn ghost sm" style="margin-top:8px" @click="step='pwd';err=''">← indietro</button>
        </div>
      </template>
    </div>
    <div class="login-foot">Powered by <a href="https://www.tastieredigitali.it" target="_blank" rel="noopener noreferrer"><b>Tastiere Digitali</b></a> — Giuseppe Sciarra</div>
  </div>
</template>

<!-- ===================== APP ===================== -->
<template x-if="token">
  <div class="app">

    <!-- ---------- SIDEBAR ---------- -->
    <aside class="sidebar" :class="sideOpen?'open':''">
      <div class="brand sidebar-brand"><img class="brand-logo" :src="brand.logo_url" alt="Tastiere Digitali"><div class="brand-app"><div class="name">Sentinel TD</div><div class="by">monitoraggio siti</div></div></div>
      <nav class="nav">
        <a :class="route.page==='dashboard'?'on':''" href="#/">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span class="txt">Dashboard</span></a>
        <a :class="route.page==='sites'&&!route.folder?'on':''" href="#/sites">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
          <span class="txt">Tutti i siti</span><span class="cnt" x-text="sites.length"></span></a>
        <a :class="route.page==='domain-expiries'?'on':''" href="#/domain-expiries">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
          <span class="txt">Scadenze domini</span></a>
        <a :class="route.page==='component-expiries'?'on':''" href="#/component-expiries">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6v4h4v6h-4v8H9v-8H5V7h4z"/><path d="M9 7h6M9 13h6"/></svg>
          <span class="txt">Scadenze plugin / temi</span></a>
        <a :class="route.page==='security'?'on':''" href="#/security">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>
          <span class="txt">Sicurezza</span>
          <span class="cnt err" x-show="sec.summary&&sec.summary.critical" x-text="sec.summary?.critical"></span></a>
        <a :class="route.page==='history'?'on':''" href="#/history">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span class="txt">Storico 7 giorni</span></a>
        <a :class="route.page==='stats'?'on':''" href="#/stats">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M7 21V10M12 21V4M17 21v-7"/></svg>
          <span class="txt">Statistiche</span></a>
        <a :class="route.page==='plugins'?'on':''" href="#/plugins">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z"/><path d="M12 6v6l4 2"/></svg>
          <span class="txt">Plugin abbandonati</span></a>

        <div class="lbl">Cartelle</div>
        <template x-for="f in folderTree" :key="f.name">
          <div>
            <a :class="route.folder===(f.tag||f.name)?'on':''" :href="'#/folder/'+encodeURIComponent(f.tag||f.name)">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              <span class="txt" x-text="f.name" translate="no"></span>
              <span class="fold-edit" role="button" title="Rinomina cartella" @click.prevent.stop="renameFolder(f.tag||f.name)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
              <span class="cnt err" x-show="f.stats.off" x-text="f.stats.off"></span>
              <span class="cnt warn" x-show="f.stats.upd" x-text="f.stats.upd"></span>
              <span class="cnt" x-text="f.stats.count"></span></a>
            <div class="sub" x-show="f.subs.length">
              <template x-for="sf in f.subs" :key="sf.tag">
                <a :class="route.folder===sf.tag?'on':''" :href="'#/folder/'+encodeURIComponent(sf.tag)">
                  <span class="txt" x-text="sf.name" translate="no"></span>
                  <span class="fold-edit" role="button" title="Rinomina cartella" @click.prevent.stop="renameFolder(sf.tag)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
                  <span class="cnt warn" x-show="f.subStats[sf.name].upd" x-text="f.subStats[sf.name].upd"></span>
                  <span class="cnt" x-text="f.subStats[sf.name].count"></span></a>
              </template>
            </div>
          </div>
        </template>
        <a x-show="noFolder.length" :class="route.folder==='__none'?'on':''" href="#/folder/__none">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span class="txt">Senza cartella</span><span class="cnt" x-text="noFolder.length"></span></a>

        <div class="lbl">Sistema</div>
        <a :class="route.page==='notifications'?'on':''" href="#/notifications">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="txt">Notifiche</span></a>
        <a :class="route.page==='reports'?'on':''" href="#/reports">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
          <span class="txt">Report mensile</span></a>
        <a :class="route.page==='clients'?'on':''" href="#/clients">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="txt">Report clienti</span></a>
        <a :class="route.page==='account'?'on':''" href="#/account">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <span class="txt">Account</span></a>
        <a :class="route.page==='settings'?'on':''" href="#/settings">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span class="txt">Impostazioni</span></a>
      </nav>
      <div class="foot">
        <div><span x-text="meta.name"></span> <span class="ver" x-show="meta.version" x-text="'v'+meta.version"></span></div>
        <div><span x-text="sites.length"></span> siti monitorati · <a href="#" @click.prevent="logout()">Esci</a></div>
        <div class="by">Powered by <a :href="meta.vendor_url" target="_blank" rel="noopener noreferrer"><b x-text="meta.vendor"></b></a> — <span x-text="meta.author"></span></div>
      </div>
    </aside>
    <div class="sb-resize" title="Trascina per allargare la barra · doppio clic per la larghezza standard"></div>
    <div class="overlay" x-show="sideOpen" @click="sideOpen=false" style="z-index:44"></div>

    <!-- ---------- MAIN ---------- -->
    <div class="main">
      <header class="topbar">
        <button class="btn icon ghost hamb" @click="sideOpen=!sideOpen"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="search" style="width:min(360px,100%)" x-show="route.page==='sites'||route.page==='dashboard'">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" placeholder="Cerca sito, url, cartella…" x-model="q" @keydown.enter="if(route.page!=='sites') go('sites')">
        </div>
        <div class="sp"></div>
        <span class="spinner" x-show="loading"></span>
        <button class="btn sm" @click="checkAll()" :disabled="checkAllBusy">Check tutti</button>
        <button class="btn sm primary" @click="updateAll()">Aggiorna tutto</button>
        <button class="btn sm" @click="openNew()">+ Sito</button>
      </header>

      <main class="content">
        <div class="msg warn" x-show="totStats.dns > 0"><span>Verifica DNS non riuscita</span>: <span x-text="totStats.dns"></span> <span>siti da ricontrollare. Il loro stato attuale non è verificato.</span></div>
        <div class="msg warn" x-show="totStats.checking > 0"><span>Verifiche da confermare</span>: <span x-text="totStats.checking"></span> · <span>ricontrollo automatico programmato</span></div>
        <div class="msg info" x-show="needs2faSetup">Non hai ancora configurato la verifica in due passaggi: <a href="#/settings">configurala nelle Impostazioni</a>.</div>

        <!-- ===== DASHBOARD ===== -->
        <template x-if="route.page==='dashboard'">
          <div>
            <h1 class="page-title">Dashboard</h1>
            <div class="page-sub">Stato del parco in tempo reale</div>
            <div class="grid kpi" style="margin:18px 0">
              <div class="card kpi ok" @click="flt='all';go('sites')"><div class="k">Siti OK</div><div class="v" x-text="totStats.count-totStats.off-totStats.dns"></div><div class="d"><span x-text="totStats.wp"></span> WordPress · <span x-text="totStats.joomla"></span> Joomla</div></div>
              <div class="card kpi warn" @click="flt='upd';go('sites')"><div class="k">Con update</div><div class="v" x-text="totStats.upd"></div><div class="d">siti con aggiornamenti pendenti</div></div>
              <div class="card kpi err" @click="flt='off';go('sites')"><div class="k">Offline</div><div class="v" x-text="totStats.off"></div><div class="d">non raggiungibili all'ultimo check</div></div>
              <div class="card kpi acc" @click="go('history')"><div class="k">Update 7 giorni</div><div class="v" x-text="histSummary?histSummary.ok:'—'"></div><div class="d"><span x-text="histSummary?histSummary.failed:0"></span> falliti</div></div>
            </div>
            <div class="grid two">
              <div class="card">
                <h3>Aggiornamenti ultimi 7 giorni</h3>
                <div class="tr-chart dash" x-show="histSummary" @mouseleave="dashHover=null">
                  <div class="tr-y">
                    <template x-for="t in dashScale.ticks" :key="'dy'+t"><span :style="'bottom:'+dashY(t)+'px'" x-text="fmtNum(t)"></span></template>
                    <span style="bottom:0">0</span>
                  </div>
                  <div class="tr-plot">
                    <template x-for="t in dashScale.ticks" :key="'dg'+t"><div class="tr-grid" :style="'bottom:'+dashY(t)+'px'"></div></template>
                    <div class="tr-grid base" style="bottom:0"></div>
                    <div class="tr-cols">
                      <template x-for="(d, i) in (histSummary?histSummary.days:[])" :key="'dc'+d.day">
                        <div class="tr-col" :class="{ hov: dashHover===d.day }" @mouseenter="dashHover=d.day">
                          <div class="tr-val" x-show="d.ok+d.failed" :style="'bottom:'+(dashY(d.ok+d.failed)+6)+'px'" x-text="fmtNum(d.ok)"></div>
                          <div class="tr-stack" :style="'height:'+dashY(d.ok+d.failed)+'px'">
                            <div class="tr-fail" x-show="d.failed" :style="'height:'+dashY(d.failed)+'px'"></div>
                            <div class="tr-ok" :style="'height:'+dashY(d.ok)+'px'"></div>
                          </div>
                          <div class="tr-tip" x-show="dashHover===d.day" :class="i >= (histSummary.days.length/2) ? 'r' : ''">
                            <b x-text="dashDay(d)"></b>
                            <div><span class="dotc ok"></span><span x-text="fmtNum(d.ok)"></span> <span>aggiornamenti</span></div>
                            <div x-show="d.failed"><span class="dotc err"></span><span x-text="fmtNum(d.failed)"></span> <span>non riusciti</span></div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                  <div class="tr-x">
                    <template x-for="d in (histSummary?histSummary.days:[])" :key="'dx'+d.day"><span x-text="dashDay(d)"></span></template>
                  </div>
                </div>
                <h3 style="margin-top:22px">Attività recente</h3>
                <div class="timeline">
                  <template x-for="h in history.slice(0,10)" :key="h.id">
                    <div class="ev">
                      <span class="dot" :class="h.ok?'ok':'err'" style="margin-top:6px"></span>
                      <div><b x-text="h.site_name" translate="no"></b> · <span x-text="h.name" translate="no"></span> <span class="mut mono small" x-text="h.from+' → '+h.to"></span><div class="err small" x-show="!h.ok" x-text="h.error"></div></div>
                      <div class="when" x-text="ago(h.at)"></div>
                    </div>
                  </template>
                  <div class="empty" x-show="!history.length">Nessun update negli ultimi 7 giorni</div>
                </div>
              </div>
              <div class="card">
                <h3>Da tenere d'occhio</h3>
                <div class="issues-rows dash-rows">
                  <template x-for="(a,i) in attention" :key="i">
                    <div class="issue-line dash-line" :class="'sev-' + (a.kind === 'err' ? 'err' : (a.kind === 'warn' ? 'warn' : 'info'))">
                      <a x-show="a.site" :href="'#/site/'+(a.site&&a.site.id)" x-text="a.site&&a.site.name" translate="no"></a>
                      <a x-show="a.link" :href="'#/'+a.link">Centro sicurezza</a>
                      <div class="issue-card-chips"><span class="issue-tag" :class="'sev-' + a.kind" x-text="a.text"></span></div>
                    </div>
                  </template>
                  <div class="empty" x-show="!dashError && (!dashProblemsLoaded || !dashSecurityLoaded)">Caricamento avvisi…</div>
                  <div class="small warn" role="status" x-show="dashError">Avvisi non aggiornati: nuovo tentativo tra poco.</div>
                  <div class="empty" x-show="dashProblemsLoaded && dashSecurityLoaded && !dashError && !attention.length">Tutto tranquillo ✨</div>
                  <a class="btn sm" href="#/servers" x-show="attentionRemaining">Apri tutti gli avvisi →</a>
                </div>
                <h3 style="margin-top:22px">Cartelle</h3>
                <template x-for="f in folderTree" :key="f.name">
                  <a class="row" style="padding:8px 0;border-bottom:1px solid var(--bd);color:inherit" :href="'#/folder/'+encodeURIComponent(f.tag||f.name)">
                    <span style="flex:1;font-weight:500" x-text="f.name" translate="no"></span>
                    <span class="badge warn" x-show="f.stats.upd" x-text="f.stats.upd+' update'"></span>
                    <span class="badge err" x-show="f.stats.off" x-text="f.stats.off+' offline'"></span>
                    <span class="badge" x-text="f.stats.count+' siti'"></span>
                  </a>
                </template>
              </div>
            </div>

            <div class="card" style="margin-top:16px">
              <div class="row"><div style="flex:1"><b>Statistiche aggiornamenti</b><div class="small mut">Andamento mensile, classifiche dei siti e confronto fra periodi.</div></div>
              <a class="btn sm" href="#/stats">Apri statistiche →</a></div>
            </div>
          </div>
        </template>

        <!-- ===== STATISTICHE ===== -->
        <template x-if="route.page==='stats'">
          <div>
            <div class="row" style="flex-wrap:wrap"><div><h1 class="page-title">Statistiche aggiornamenti</h1><div class="page-sub">Andamento mensile, classifiche e confronto fra periodi — su tutto lo storico disponibile</div></div></div>
            <div style="margin-top:16px">
<div class="card" style="margin-top:16px" x-show="stats.data">
              <div class="row" style="flex-wrap:wrap;gap:10px">
                <div class="seg">
                  <button :class="stats.mode==='days'?'on':''" @click="stats.mode='days';loadStats(false)">Giorni</button>
                  <button :class="stats.mode==='month'?'on':''" @click="stats.mode='month';loadStats(false)">Un mese</button>
                  <button :class="stats.mode==='compare'?'on':''" @click="stats.mode='compare';loadCompare()">Confronta due mesi</button>
                </div>
                <span class="spinner" x-show="stats.busy"></span>
                <div class="sp"></div>
                <span class="small mut">Perimetro</span>
                <select class="input" style="max-width:210px" x-model="stats.scope" @change="loadStats(false)">
                  <template x-for="s in stats.scopes" :key="'sc'+s.key"><option :value="s.key" :selected="s.key===stats.scope" x-text="s.label"></option></template>
                </select>
                <button class="btn" @click="openTokenLink(() => statsPdfUrl())" title="Scarica in PDF quello che vedi: mese selezionato o confronto"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg> Scarica PDF</button>
              </div>

              <!-- ANDAMENTO -->
              <div class="tr-head">
                <div class="tr-title">
                  <b>Andamento</b>
                  <div class="small mut" x-show="stats.mode!=='days'">Aggiornamenti applicati per mese — <b>clicca una barra</b> per vedere il dettaglio di quel mese</div>
                  <div class="small mut" x-show="stats.mode==='days'">Aggiornamenti applicati giorno per giorno</div>
                </div>
                <div class="seg" x-show="stats.mode!=='days'">
                  <button type="button" :class="stats.months===6?'on':''" @click="stats.months=6;loadStats(false)">6 mesi</button>
                  <button type="button" :class="stats.months===12?'on':''" @click="stats.months=12;loadStats(false)">12 mesi</button>
                  <button type="button" :class="stats.months===24?'on':''" @click="stats.months=24;loadStats(false)">24 mesi</button>
                </div>
                <div class="seg" x-show="stats.mode==='days'">
                  <button type="button" :class="stats.days===7?'on':''" @click="stats.days=7;loadStats(false)">7 giorni</button>
                  <button type="button" :class="stats.days===30?'on':''" @click="stats.days=30;loadStats(false)">30 giorni</button>
                  <button type="button" :class="stats.days===90?'on':''" @click="stats.days=90;loadStats(false)">90 giorni</button>
                </div>
              </div>

              <div class="tr-kpis" x-show="!statEmptyWindow && stats.trend">
                <div><span class="k">Totale nel periodo</span><b x-text="fmtNum(stats.trend && stats.trend.total)"></b></div>
                <div><span class="k" x-text="stats.mode==='days' ? 'Media giornaliera' : 'Media mensile'"></span><b x-text="fmtNum(stats.trend && stats.trend.avg, 1)"></b></div>
                <div><span class="k" x-text="stats.mode==='days' ? 'Giorno migliore' : 'Mese migliore'"></span><b><span x-text="trendBest.value"></span> <small x-text="trendBest.label"></small></b></div>
                <div><span class="k" x-text="stats.mode==='days' ? 'Rispetto al periodo prima' : 'Rispetto al mese prima'"></span><b :class="deltaCls(trendPeriodDelta)" x-text="deltaTxt(trendPeriodDelta)"></b></div>
              </div>

              <div class="tr-chart" x-show="!statEmptyWindow" @mouseleave="stats.hover=null">
                <div class="tr-y">
                  <template x-for="t in trendScale.ticks" :key="'y'+t"><span :style="'bottom:'+trendY(t)+'px'" x-text="fmtNum(t)"></span></template>
                  <span style="bottom:0">0</span>
                </div>
                <div class="tr-plot">
                  <template x-for="t in trendScale.ticks" :key="'g'+t"><div class="tr-grid" :style="'bottom:'+trendY(t)+'px'"></div></template>
                  <div class="tr-grid base" style="bottom:0"></div>
                  <div class="tr-avg" x-show="stats.trend && stats.trend.avg>0" :style="'bottom:'+trendY(stats.trend ? stats.trend.avg : 0)+'px'">
                    <span><span>media</span> <span x-text="fmtNum(stats.trend && stats.trend.avg, 1)"></span></span>
                  </div>
                  <div class="tr-cols">
                    <template x-for="(m, i) in (stats.trend ? stats.trend.months : [])" :key="'c'+m.period">
                      <div class="tr-col" :class="{ sel: m.period===stats.period, hov: stats.hover===m.period }"
                           @mouseenter="stats.hover=m.period" @click="pickMonth(m.period)">
                        <div class="tr-val" x-show="trendShowVal(m)" :style="'bottom:'+(trendY((m.updates||0)+(m.failed||0))+6)+'px'" x-text="fmtNum(m.updates)"></div>
                        <div class="tr-stack" :style="'height:'+trendY((m.updates||0)+(m.failed||0))+'px'">
                          <div class="tr-fail" x-show="m.failed" :style="'height:'+trendY(m.failed)+'px'"></div>
                          <div class="tr-ok" :style="'height:'+trendY(m.updates)+'px'"></div>
                        </div>
                        <div class="tr-tip" x-show="stats.hover===m.period"
                             :class="i >= stats.trend.months.length/2 ? 'r' : ''">
                          <b x-text="m.label"></b>
                          <div><span class="dotc ok"></span><span x-text="fmtNum(m.updates)"></span> <span>aggiornamenti</span></div>
                          <div x-show="m.failed"><span class="dotc err"></span><span x-text="fmtNum(m.failed)"></span> <span>non riusciti</span></div>
                          <div class="mut"><span x-text="m.sites"></span> <span>siti</span> · <span x-text="m.components"></span> <span>componenti</span></div>
                          <div x-show="m.delta!==null && m.delta!==undefined"><span :class="deltaCls(m)" x-text="deltaTxt(m)"></span> <span class="mut" x-text="stats.mode==='days' ? 'rispetto al giorno prima' : 'rispetto al mese prima'"></span></div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
                <div class="tr-x">
                  <template x-for="(m, i) in (stats.trend ? stats.trend.months : [])" :key="'x'+m.period">
                    <span :class="m.period===stats.period ? 'sel' : ''" x-text="axisLabel(m, i, stats.trend.months.length)"></span>
                  </template>
                </div>
              </div>
              <div class="tr-legend" x-show="!statEmptyWindow">
                <span><i class="sw ok"></i>Riusciti</span>
                <span><i class="sw err"></i>Non riusciti</span>
                <span><i class="sw avg"></i><span x-text="stats.mode==='days' ? 'Media giornaliera' : 'Media mensile'"></span></span>
              </div>
              <div class="empty" x-show="statEmptyWindow" style="padding:28px">Nessun aggiornamento registrato negli ultimi <span x-text="stats.months"></span> mesi in questo perimetro.</div>

              <!-- PER GIORNO DELLA SETTIMANA -->
              <template x-if="stats.mode==='days' && statWeekdays.length">
                <div class="wd-wrap">
                  <b style="font-size:13px">Per giorno della settimana</b>
                  <div class="small mut" style="margin-bottom:10px">Totale degli aggiornamenti applicati nel periodo, per giorno</div>
                  <div class="wd">
                    <template x-for="w in statWeekdays" :key="'wd'+w.idx">
                      <div class="wd-item" :title="w.name+': '+fmtNum(w.updates)+' aggiornamenti in '+w.days+' giorni'">
                        <div class="wd-bar"><div class="wd-fill" :style="'width:'+w.pct+'%'"></div></div>
                        <span class="wd-name" x-text="w.name"></span>
                        <span class="wd-val" x-text="fmtNum(w.updates)"></span>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- MODALITÀ MESE / GIORNI: dettaglio e classifiche -->
              <template x-if="(stats.mode==='month' || stats.mode==='days') && stats.data">
                <div>
                  <div class="row" style="margin:20px 0 4px;flex-wrap:wrap;gap:10px;border-top:1px solid var(--bd);padding-top:16px">
                    <template x-if="stats.mode==='days'">
                      <div style="flex:1;min-width:200px"><b style="font-size:15px" x-text="stats.data.period_label"></b>
                        <div class="small mut">Dettaglio del periodo selezionato</div></div>
                    </template>
                    <template x-if="stats.mode!=='days'">
                      <div style="flex:1;min-width:200px"><b style="font-size:15px" x-text="stats.data.period_label"></b>
                        <div class="small mut">Dettaglio del mese selezionato · confronto con <span x-text="stats.data.prev_label"></span></div></div>
                    </template>
                    <div class="row" style="gap:4px" x-show="stats.mode!=='days'">
                      <button class="btn icon" :disabled="!!(!canShiftStat(-1))" @click="shiftStatMonth(-1)" title="Mese precedente (freccia ←)">‹</button>
                      <select class="input" style="max-width:190px" x-model="stats.period" @change="pickMonth(stats.period)">
                        <template x-for="m in statMonths" :key="'pp'+m.period"><option :value="m.period" :selected="m.period===stats.period" x-text="m.label+(m.updates?' — '+m.updates+' update':'')"></option></template>
                      </select>
                      <button class="btn icon" :disabled="!!(!canShiftStat(1))" @click="shiftStatMonth(1)" title="Mese successivo (freccia →)">›</button>
                    </div>
                  </div>
                  <div class="grid kpi" style="margin:10px 0 6px">
                    <div class="card kpi acc"><div class="k">Aggiornamenti</div><div class="v" x-text="stats.data.totals.updates"></div>
                      <div class="d"><span :class="statDelta(stats.data.totals.updates,stats.data.prev_totals.updates).cls" x-text="statDelta(stats.data.totals.updates,stats.data.prev_totals.updates).txt"></span> vs <span x-text="stats.data.prev_label"></span></div></div>
                    <div class="card kpi ok"><div class="k">Siti aggiornati</div><div class="v" x-text="stats.data.totals.sites"></div>
                      <div class="d"><span :class="statDelta(stats.data.totals.sites,stats.data.prev_totals.sites).cls" x-text="statDelta(stats.data.totals.sites,stats.data.prev_totals.sites).txt"></span></div></div>
                    <div class="card kpi"><div class="k">Componenti diversi</div><div class="v" x-text="stats.data.totals.components"></div>
                      <div class="d"><span :class="statDelta(stats.data.totals.components,stats.data.prev_totals.components).cls" x-text="statDelta(stats.data.totals.components,stats.data.prev_totals.components).txt"></span></div></div>
                    <div class="card kpi err"><div class="k">Non riusciti</div><div class="v" x-text="stats.data.totals.failed"></div>
                      <div class="d"><span :class="statDeltaFail(stats.data.totals.failed,stats.data.prev_totals.failed).cls" x-text="statDeltaFail(stats.data.totals.failed,stats.data.prev_totals.failed).txt"></span></div></div>
                  </div>

                  <div class="grid two stat-cols" style="margin-top:14px">
                    <div>
                      <h3>Siti più aggiornati — <span x-text="stats.data.period_label"></span></h3>
                      <template x-for="(s, si) in stats.data.top_sites" :key="'ts'+s.site_id">
                        <a class="statrow" :href="'#/site/'+s.site_id">
                          <div class="nm"><span class="cdot" :style="'background:'+colorIdx(si)"></span><span class="cms" :class="s.cms" x-text="s.cms==='wp'?'WP':'J'"></span> <span x-text="s.name" translate="no"></span></div>
                          <div class="bar"><div class="fill" :style="'width:'+statBar(s.updates, stats.data.max_site)+';background:'+colorGradIdx(si)"></div></div>
                          <div class="val"><b x-text="s.updates"></b>
                            <span class="small" :class="s.delta>0?'ok':(s.delta<0?'err':'mut')" x-text="(s.delta>0?'+':'')+s.delta"></span>
                            <span class="badge err" x-show="s.failed" x-text="s.failed+' ko'"></span></div>
                        </a>
                      </template>
                      <div class="empty" x-show="!stats.data.top_sites.length">Nessun aggiornamento registrato in <span x-text="stats.data.period_label"></span></div>
                    </div>
                    <div>
                      <h3>Componenti più aggiornati</h3>
                      <template x-for="(c, ci) in stats.data.top_components" :key="'tc'+c.name">
                        <div class="statrow">
                          <div class="nm"><span class="cdot" :style="'background:'+colorIdx(ci)"></span><span x-text="c.name" translate="no"></span> <span class="badge" x-text="c.type"></span></div>
                          <div class="bar"><div class="fill" :style="'width:'+statBar(c.count, stats.data.max_component)+';background:'+colorGradIdx(ci)"></div></div>
                          <div class="val"><b x-text="c.count"></b> <span class="small mut" x-text="'su '+c.sites"></span></div>
                        </div>
                      </template>
                      <div class="empty" x-show="!stats.data.top_components.length">Nessun componente aggiornato in questo mese</div>
                    </div>
                  </div>
                </div>
              </template>

              <!-- MODALITÀ CONFRONTO -->
              <template x-if="stats.mode==='compare'">
                <div style="margin-top:16px">
                  <div class="row" style="flex-wrap:wrap;gap:8px">
                    <span class="small mut">Confronta</span>
                    <select class="input" style="max-width:170px" x-model="stats.cmpA" @change="loadCompare()">
                      <template x-for="p in stats.periods" :key="'ca'+p.period"><option :value="p.period" :selected="p.period===stats.cmpA" x-text="p.label"></option></template>
                    </select>
                    <span class="small mut">con</span>
                    <select class="input" style="max-width:170px" x-model="stats.cmpB" @change="loadCompare()">
                      <template x-for="p in stats.periods" :key="'cb'+p.period"><option :value="p.period" :selected="p.period===stats.cmpB" x-text="p.label"></option></template>
                    </select>
                  </div>
                  <template x-if="stats.cmp">
                    <div>
                      <div class="grid kpi" style="margin:16px 0">
                        <div class="card kpi"><div class="k" x-text="stats.cmp.a.label"></div><div class="v" x-text="stats.cmp.a.updates"></div><div class="d"><span x-text="stats.cmp.a.sites"></span> siti · <span x-text="stats.cmp.a.components"></span> componenti</div></div>
                        <div class="card kpi acc"><div class="k" x-text="stats.cmp.b.label"></div><div class="v" x-text="stats.cmp.b.updates"></div><div class="d"><span x-text="stats.cmp.b.sites"></span> siti · <span x-text="stats.cmp.b.components"></span> componenti</div></div>
                        <div class="card kpi"><div class="k">Variazione</div>
                          <div class="v" :class="statDelta(stats.cmp.b.updates,stats.cmp.a.updates).cls" x-text="statDelta(stats.cmp.b.updates,stats.cmp.a.updates).txt"></div>
                          <div class="d">aggiornamenti totali</div></div>
                        <div class="card kpi err"><div class="k">Non riusciti</div><div class="v" x-text="stats.cmp.b.failed"></div><div class="d">erano <span x-text="stats.cmp.a.failed"></span></div></div>
                      </div>
                      <div class="tbl-wrap">
                        <table class="tbl responsive">
                          <thead><tr><th>Sito</th><th class="n" x-text="stats.cmp.a.label"></th><th class="n" x-text="stats.cmp.b.label"></th><th class="n">Variazione</th><th></th></tr></thead>
                          <tbody>
                            <template x-for="(r, ri) in stats.cmp.sites" :key="'cs'+r.site_id">
                              <tr class="row" @click="go('site/'+r.site_id)">
                                <td><span class="cdot" :style="'background:'+colorIdx(ri)"></span><span class="cms" :class="r.cms" x-text="r.cms==='wp'?'WP':'J'"></span> <span x-text="r.name" translate="no"></span></td>
                                <td class="num" x-text="r.a"></td>
                                <td class="num"><b x-text="r.b"></b></td>
                                <td class="num"><span :class="r.delta>0?'ok':(r.delta<0?'err':'mut')" x-text="(r.delta>0?'+':'')+r.delta+(r.pct===null?'':' ('+(r.delta>0?'+':'')+r.pct+'%)')"></span></td>
                                <td class="hide-m" style="width:120px"><div class="bar" style="margin:0"><div class="fill" :style="'width:'+statBar(r.b, stats.cmp.max)+';background:'+colorGradIdx(ri)"></div></div></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                        <div class="empty" x-show="!stats.cmp.sites.length">Nessun dato nei due mesi scelti</div>
                      </div>
                      <h3 style="margin-top:18px">Componenti — differenze</h3>
                      <div class="tbl-wrap">
                        <table class="tbl responsive">
                          <thead><tr><th>Componente</th><th class="n" x-text="stats.cmp.a.label"></th><th class="n" x-text="stats.cmp.b.label"></th><th class="n">Variazione</th></tr></thead>
                          <tbody>
                            <template x-for="(c, cci) in stats.cmp.components" :key="'cc'+c.name">
                              <tr><td><span class="cdot" :style="'background:'+colorIdx(cci)"></span><span x-text="c.name" translate="no"></span></td><td class="num" x-text="c.a"></td><td class="num"><b x-text="c.b"></b></td>
                                <td class="num"><span :class="c.delta>0?'ok':(c.delta<0?'err':'mut')" x-text="(c.delta>0?'+':'')+c.delta"></span></td></tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
            </div>
            </div>
            <div class="empty" x-show="!stats.data&&!stats.busy">Ancora nessun dato: le statistiche si popolano con i cicli di aggiornamento.</div>
          </div>
        </template>

        <!-- ===== SITES (tutti / cartella) ===== -->
        <template x-if="route.page==='sites'">
          <div>
            <div class="row" style="margin-bottom:6px;flex-wrap:wrap">
              <div><h1 class="page-title" x-text="pageTitle"></h1><div class="page-sub"><span x-text="pageStats.count"></span> siti · <span x-text="pageStats.upd"></span> con update · <span x-text="pageStats.off"></span> offline</div></div>
              <div class="sp"></div>
              <button class="btn sm" :class="selMode?'primary':''" @click="selMode=!selMode;selIds=[]" x-text="selMode?'✕ Esci selezione':'☑ Seleziona'"></button>
              <button class="btn sm" @click="openInstall('install')">Installa</button>
              <button class="btn sm" @click="openInstall('remove')">Rimuovi</button>
              <button class="btn sm" @click="exportCsv()">Esporta CSV</button>
            </div>
            <div class="toolbar">
              <div class="chips">
                <span class="fchip" :class="flt==='all'?'on':''" @click="flt='all'">Tutti <span class="n" x-text="pageSites.length"></span></span>
                <span class="fchip" :class="flt==='upd'?'on':''" @click="flt='upd'">Con update <span class="n" x-text="pageStats.upd"></span></span>
                <span class="fchip" :class="flt==='off'?'on':''" @click="flt='off'">Offline <span class="n" x-text="pageStats.off"></span></span>
                <span class="fchip" :class="flt==='wp'?'on':''" @click="flt='wp'">WordPress <span class="n" x-text="pageSites.filter(s=>s.cms==='wp').length"></span></span>
                <span class="fchip" :class="flt==='joomla'?'on':''" @click="flt='joomla'">Joomla <span class="n" x-text="pageSites.filter(s=>s.cms==='joomla').length"></span></span>
              </div>
            </div>
            <div class="tbl-wrap">
              <table class="tbl responsive">
                <thead><tr>
                  <th x-show="selMode" style="width:36px"><input type="checkbox" :checked="filtered.length&&filtered.every(s=>selIds.includes(s.id))" @change="selAll()"></th>
                  <th class="sort" @click="sortBy('status')" style="width:36px"></th>
                  <th class="sort" @click="sortBy('name')">Sito</th>
                  <th>Cartelle</th>
                  <th class="sort" @click="sortBy('core_current')">CMS / core</th>
                  <th>PHP</th>
                  <th>Dominio</th>
                  <th class="sort" @click="sortBy('updates')">Update</th>
                  <th class="sort" @click="sortBy('checked')">Check</th>
                  <th></th>
                </tr></thead>
                <tbody>
                  <template x-for="s in filtered" :key="s.id">
                    <tr class="row" :class="selIds.includes(s.id)?'selected':''" @click="selMode?toggleSel(s.id):go('site/'+s.id)">
                      <td x-show="selMode" @click.stop><input type="checkbox" :checked="selIds.includes(s.id)" @change="toggleSel(s.id)"></td>
                      <td><span class="dot" :class="statusTone(s)" :title="statusTitle(s)"></span></td>
                      <td><div class="site-cell">
                        <span class="site-thumb" :title="s.shot_blocked_at ? 'Il sito respinge l\'accesso automatico (antibot): anteprima non aggiornata' : (s.shot_at ? 'Anteprima di '+ago(s.shot_at) : 'Anteprima non ancora disponibile')">
                          <img x-show="s.shot_path" :src="thumbUrl(s)" loading="lazy" alt="" @error="$event.target.style.visibility='hidden'">
                          <span class="ini" x-show="!s.shot_path" x-text="initials(s.name)"></span><i class="thumb-flag" x-show="s.shot_blocked_at" title="Anteprima bloccata dall'antibot del sito">🛡</i>
                        </span>
                        <span style="min-width:0">
                          <span class="name" x-text="s.name" translate="no"></span>
                          <span class="url" x-text="s.url.replace(/^https?:\/\//,'')" translate="no"></span>
                          <span class="badge" x-show="s.notifications_silenced">🔕 silenziato</span>
                        </span>
                      </div></td>
                      <td class="hide-m"><template x-for="t in siteTags(s)" :key="t"><button type="button" class="chip click-chip" @click.stop="go('folder/'+encodeURIComponent(t))" x-text="t" title="Apri cartella" translate="no"></button></template><span class="mut small" x-show="!siteTags(s).length">—</span></td>
                      <td><span class="cms" :class="s.cms" x-text="s.cms==='wp'?'WP':'JOOMLA'"></span> <span class="mono small" x-text="coreLabel(s)"></span> <span class="badge warn" x-show="s.core_update" x-text="'→ '+s.core_latest"></span></td>
                      <td class="hide-m"><span class="mono small" x-text="s.php_version||'—'"></span> <span class="badge" :class="phpState(s.php_version).cls" x-show="phpState(s.php_version).label" x-text="phpState(s.php_version).label"></span></td>
                      <td class="hide-m"><span class="badge" :class="domainExpiryClass(s)" :title="s.domain_check_error || ''" x-show="s.domain_expires_at || s.domain_check_error" x-text="domainExpiryText(s)"></span><span class="mut small" x-show="!s.domain_expires_at && !s.domain_check_error">—</span></td>
                      <td class="num"><span class="badge warn" x-show="hasUpd(s)" x-text="s.updates_count"></span><span class="badge ok" x-show="!hasUpd(s)&&!isOff(s)&&!isDnsIssue(s)&&!isCheckPending(s)">ok</span><span class="badge warn" x-show="isDnsIssue(s)" :title="s.error">verifica DNS</span><span class="badge warn" x-show="isCheckPending(s)" :title="s.error">da confermare</span><span class="badge err" x-show="isOff(s)">offline</span></td>
                      <td class="hide-m mut small" x-text="ago(s.last_checked)"></td>
                      <td @click.stop><div class="acts">
                        <button class="btn sm icon" title="Check" @click="check(s)" :disabled="!!(busy[s.id])"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg></button>
                        <button class="btn sm icon" title="Aggiorna ora" @click="updateNow(s)" x-show="hasUpd(s)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M6 9l6-6 6 6M4 21h16"/></svg></button>
                        <button class="btn sm icon" title="Apri admin" @click="goAdmin(s)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M9 6H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4"/></svg></button>
                      </div></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="empty" x-show="!filtered.length">Nessun sito corrisponde ai filtri</div>
            </div>
            <div class="selbar" x-show="selMode&&selIds.length">
              <b x-text="selIds.length+' selezionati'"></b>
              <button class="btn sm primary" @click="updateSelected()">Aggiorna ora</button>
              <button class="btn sm" @click="openTags()">Cartelle ±</button>
              <button class="btn sm" @click="shootBulk(true)" title="Rigenera l'anteprima dei siti selezionati">🖼 Anteprime</button>
              <button class="btn sm" @click="openDetailReport(selIds)" title="Report dettagliato dei siti selezionati">📄 Report</button>
              <button class="btn sm" @click="setAutoSelected(true)">Auto-update ON</button>
              <button class="btn sm" @click="setAutoSelected(false)">Auto-update OFF</button>
              <div class="sp"></div>
              <button class="btn sm ghost" @click="exitSel()">Annulla</button>
            </div>
          </div>
        </template>

        <!-- ===== SITE DETAIL ===== -->
        <template x-if="route.page==='site'&&detail">
          <div>
            <a href="#/sites" class="small mut">← siti</a>
            <div class="row" style="margin:6px 0 14px;flex-wrap:wrap">
              <span class="dot" :class="statusTone(detail)" :title="statusTitle(detail)" style="width:12px;height:12px"></span>
              <div><h1 class="page-title" x-text="detail.name" translate="no"></h1><div class="page-sub"><a :href="detail.url" target="_blank" x-text="detail.url" translate="no"></a></div></div>
              <div class="sp"></div>
              <button class="btn sm" @click="check(detail)" :disabled="!!(busy[detail.id])"><span class="spinner" x-show="busy[detail.id]"></span> Check ora</button>

              <button class="btn sm" @click="openEdit(detail)">Modifica</button>
            </div>
            <div class="tabs">
              <button :class="route.tab==='overview'?'on':''" @click="go('site/'+detail.id)">Panoramica</button>
              <button :class="route.tab==='ext'?'on':''" @click="go('site/'+detail.id+'/ext')">Estensioni <span class="badge warn" x-show="detail.updates_count" x-text="detail.updates_count"></span></button>
              <button :class="route.tab==='history'?'on':''" @click="go('site/'+detail.id+'/history')">Storico</button>
            </div>

            <template x-if="route.tab==='overview'">
              <div class="site-tab"><div class="grid two">
                <div class="card">
                  <h3>Stato</h3>
                  <div class="msg warn" x-show="isCheckPending(detail)" x-text="'Verifica da confermare: '+(detail.error||'ricontrollo programmato')"></div>
                  <div class="msg err" x-show="isOff(detail)" x-text="'Offline: '+(detail.error||detail.status)"></div>
                  <div class="msg warn" x-show="isDnsIssue(detail)" x-text="detail.error || 'Verifica DNS non riuscita'"></div>
                  <div class="kv">
                    <div class="k">CMS</div><div><span class="cms" :class="detail.cms" x-text="detail.cms==='wp'?'WP':'JOOMLA'"></span> <span class="mono" x-text="detail.core_current"></span> <span class="badge warn" x-show="detail.core_update" x-text="'disponibile '+detail.core_latest"></span></div>
                    <div class="k">PHP</div><div><span class="mono" x-text="detail.php_version||'—'"></span> <span class="badge" :class="phpState(detail.php_version).cls" x-show="phpState(detail.php_version).label" x-text="phpState(detail.php_version).label"></span></div>
                    <div class="k">Dominio</div><div><span x-text="detail.domain_name||'—'"></span> <span class="badge" :class="domainExpiryClass(detail)" :title="detail.domain_check_error || ''" x-show="detail.domain_expires_at || detail.domain_check_error" x-text="domainExpiryText(detail)"></span><div class="small warn" x-show="detail.domain_check_error" x-text="detail.domain_check_error"></div></div>
                    <div class="k">Notifiche</div><div><span class="badge" :class="detail.notifications_silenced?'warn':'ok'" x-text="detail.notifications_silenced?'silenziate':'attive'"></span></div>
                    <div class="k">Ultimo check</div><div><span x-text="fmtDate(detail.last_checked)"></span><div class="small warn" x-show="detail.updates_unverified_at" style="margin-top:3px"><span>Aggiornamenti non verificati:</span> <span x-text="fmtDate(detail.updates_unverified_at)"></span> <span>il sito non ha potuto ricalcolarli (cache di WordPress mancante). Qui vale l'ultimo controllo riuscito; un Check ora riprova.</span></div></div>
                    <div class="k">Plugin</div><div><span x-text="detail.tot_plugins"></span> installati · <span :class="detail.upd_plugins?'warn':''" x-text="detail.upd_plugins+' da aggiornare'"></span></div>
                    <div class="k">Temi</div><div><span x-text="detail.tot_themes"></span> installati · <span x-text="detail.upd_themes+' da aggiornare'"></span></div>
                    <div class="k">Altro</div><div><span x-text="detail.tot_other"></span> · <span x-text="detail.upd_other+' da aggiornare'"></span></div>
                    <div class="k">Auto-update</div><div><span class="badge" :class="detail.auto_update?'ok':''" x-text="detail.auto_update?'attivo':'manuale'"></span></div>
                    <div class="k">Cartelle</div><div><template x-for="t in siteTags(detail)" :key="t"><span class="chip" x-text="t" translate="no"></span></template><span class="mut" x-show="!siteTags(detail).length">—</span></div>
                  </div>
                </div>
                <div>
                <div class="card" style="margin-bottom:16px">
                  <div class="row" style="margin-bottom:10px">
                    <h3 style="margin:0;flex:1">Anteprima</h3>
                    <span class="small mut" x-show="detail.shot_at" x-text="ago(detail.shot_at)"></span>
                    <button class="btn sm ghost" @click="shootNow(detail)" :disabled="!!(busy['shot'+detail.id])">
                      <span class="spinner" x-show="busy['shot'+detail.id]"></span> ⟳ Aggiorna
                    </button>
                  </div>
                  <div class="shot-blocked" x-show="detail.shot_blocked_at">🛡 <b>Il sito respinge l'accesso automatico</b> (di solito un antibot, come quello di SiteGround o Cloudflare). <span x-show="detail.shot_path">Questa è l'ultima anteprima riuscita.</span> Per vederla aggiornata fai consentire l'IP del pannello nel firewall del sito.</div>
                  <a :href="detail.url" target="_blank" x-show="detail.shot_path" class="shot-wrap">
                    <img :src="shotUrl(detail)" :alt="'Anteprima '+detail.name" loading="lazy" @error="onShotError(detail, $event.target)">
                  </a>
                  <div class="empty" x-show="!detail.shot_path" style="padding:34px">
                    Nessuna anteprima ancora: premi <b>⟳ Aggiorna</b> per catturarla.
                  </div>
                </div>
                <div class="card">
                  <h3>Ultimi eventi</h3>
                  <div class="timeline">
                    <template x-for="h in siteHistory.slice(0,8)" :key="h.id">
                      <div class="ev"><span class="dot" :class="h.ok?'ok':'err'" style="margin-top:6px"></span><div><span x-text="h.name" translate="no"></span> <span class="mono small mut" x-text="h.from+' → '+h.to"></span><div class="err small" x-show="!h.ok" x-text="h.error"></div></div><div class="when" x-text="ago(h.at)"></div></div>
                    </template>
                    <div class="empty" x-show="!siteHistory.length">Nessun update negli ultimi 7 giorni</div>
                  </div>
                </div>
                </div>
              </div>

              </div>
            </template>

            <template x-if="route.tab==='ext'">
              <div class="tbl-wrap site-tab">
                <table class="tbl">
                  <thead><tr><th class="sortable" @click="tSort('ext','name')">Estensione<span x-text="tMark('ext','name')"></span></th><th class="sortable" @click="tSort('ext','type')">Tipo<span x-text="tMark('ext','type')"></span></th><th class="sortable" @click="tSort('ext','cur')">Installata<span x-text="tMark('ext','cur')"></span></th><th class="sortable" @click="tSort('ext','avail')">Disponibile<span x-text="tMark('ext','avail')"></span></th><th class="sortable" @click="tSort('ext','state')">Stato<span x-text="tMark('ext','state')"></span></th><th></th></tr></thead>
                  <tbody>
                    <template x-for="e in tSorted('ext', [...detail.extensions].sort((a,b)=>((b.update_available&&!isLocked(b))-(a.update_available&&!isLocked(a)))||(isLocked(b)-isLocked(a))||a.name.localeCompare(b.name)))" :key="e.type+e.slug">
                      <tr><td><div class="name" x-text="e.name" translate="no"></div><div class="url mono" x-text="e.slug"></div></td><td><span class="badge" x-text="e.type"></span></td><td class="mono" x-text="e.current_version||'—'"></td><td class="mono" x-text="e.update_available?e.new_version:'—'"></td><td><span class="badge" x-show="isLocked(e)" title="Bloccato alla versione installata: Sentinel non lo aggiorna">🔒 bloccato</span><span class="badge" x-show="!isLocked(e)" :class="e.update_available?'warn':'ok'" x-text="e.update_available?'update':'ok'"></span></td><td class="lock-cell"><button class="btn sm ghost" x-show="e.type==='plugin'||e.type==='theme'" @click="toggleLock(e)" :disabled="!!(busy['lock'+e.type+e.slug])" :title="isLocked(e) ? 'Sblocca: torna ad aggiornarsi normalmente' : 'Blocca alla versione installata: Sentinel non lo aggiornerà finché non lo sblocchi'" x-text="isLocked(e) ? 'Sblocca' : 'Blocca'"></button></td></tr>
                    </template>
                  </tbody>
                </table>
                <div class="empty" x-show="!detail.extensions.length">Nessuna estensione censita: fai un check</div>
              </div>
            </template>

            <template x-if="route.tab==='history'">
              <div class="card site-tab"><div class="timeline">
                <template x-for="h in siteHistory" :key="h.id">
                  <div class="ev"><span class="dot" :class="h.ok?'ok':'err'" style="margin-top:6px"></span><div><b x-text="h.name" translate="no"></b> <span class="badge" x-text="h.type"></span> <span class="mono small mut" x-text="h.from+' → '+h.to"></span><div class="err small" x-show="!h.ok" x-text="h.error"></div><div class="small mut" x-show="h.ok && h.error" x-text="h.error"></div><button class="btn sm ghost" style="margin-top:4px" x-show="h.ok && h.backup && h.from && (h.type==='plugin'||h.type==='theme')" :disabled="!!(busy['rb'+h.id])" @click="rollbackItem(h)" :title="'Rimette la ' + h.from + ' dalla copia fatta prima dell\'aggiornamento (' + h.backup + ')'" x-text="'⏪ Ripristina la ' + h.from"></button></div><div class="when" x-text="fmtDate(h.at)"></div></div>
                </template>
                <div class="empty" x-show="!siteHistory.length">Nessun update negli ultimi 7 giorni</div>
              </div></div>
            </template>

            <div class="card" style="margin-top:16px;border-color:rgba(255,93,108,.25)">
              <div class="row"><div><b>Rimuovi da Sentinel</b><div class="small mut">Il sito non viene toccato: smette solo di essere monitorato.</div></div><div class="sp"></div><button class="btn sm danger" @click="delSite(detail)">Elimina</button></div>
            </div>
          </div>
        </template>

        <!-- ===== SCADENZE DOMINI ===== -->
        <template x-if="route.page==='domain-expiries'">
          <div>
            <div class="row" style="flex-wrap:wrap">
              <div><h1 class="page-title">Scadenze domini</h1>
                <div class="page-sub">Scadenza, registrar e decisione di rinnovo, divisi per cartella come i siti.</div></div>
              <div class="sp"></div>
              <span class="spinner" x-show="exp.loadingDomains||exp.busy"></span>
              <button class="btn sm" :disabled="!!exp.busy" @click="scanDomains()">Aggiorna tutti in sequenza</button>
            </div>
            <div class="msg info" x-show="exp.whoisProgress"><span>Aggiornamento WHOIS</span>: <span x-text="exp.whoisProgress?.done"></span> / <span x-text="exp.whoisProgress?.total"></span> <span>domini controllati</span><span x-show="exp.whoisProgress?.errors"> · <span x-text="exp.whoisProgress?.errors"></span> <span>con errori</span></span></div>

            <!-- riepilogo: ogni riquadro e' anche un filtro -->
            <div class="grid kpi dk-kpi" style="margin:18px 0">
              <div class="card kpi acc" :class="exp.dRenew===''?'on':''" @click="exp.dRenew=''"><div class="k">Domini</div><div class="v" x-text="domainScope().length"></div>
                <div class="d" :translate="exp.dFolder && exp.dFolder!=='__none' ? 'no' : 'yes'" x-text="exp.dFolder ? (exp.dFolder==='__none' ? 'senza cartella' : exp.dFolder) : 'tutte le cartelle'"></div></div>
              <div class="card kpi warn" :class="exp.dRenew==='todo'?'on':''" @click="exp.dRenew='todo'"><div class="k">Da decidere</div><div class="v" x-text="domainScope().filter(x=>!x.renew).length"></div>
                <div class="d">avviso <span x-text="prefs.domain_decision_days"></span> giorni prima</div></div>
              <div class="card kpi ok" :class="exp.dRenew==='yes'?'on':''" @click="exp.dRenew='yes'"><div class="k">Si rinnovano</div><div class="v" x-text="domainScope().filter(x=>x.renew==='yes').length"></div></div>
              <div class="card kpi err" :class="exp.dRenew==='no'?'on':''" @click="exp.dRenew='no'"><div class="k">Non si rinnovano</div><div class="v" x-text="domainScope().filter(x=>x.renew==='no').length"></div></div>
            </div>

            <!-- strumenti: ricerca, cartella, scadenza -->
            <div class="dk-tools">
              <div class="search"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input class="input" x-model="exp.dFilter" placeholder="Cerca dominio, sito o registrar…"></div>
              <select class="input dk-folder" x-model="exp.dFolder">
                <option value="" :selected="exp.dFolder===''">Tutte le cartelle</option>
                <template x-for="f in domainFolders()" :key="'dfo'+f.tag"><option :value="f.tag" :selected="exp.dFolder===f.tag" x-text="f.tag+' ('+f.count+')'" translate="no"></option></template>
                <option value="__none" :selected="exp.dFolder==='__none'" x-show="exp.domains.some(d=>!(d.tags||[]).length)">Senza cartella</option>
              </select>
              <select class="input dk-sort" x-model="exp.dSort" title="Ordina e raggruppa l'elenco">
                <option value="folder" :selected="exp.dSort==='folder'">Ordina per cartella (cliente)</option>
                <option value="registrar" :selected="exp.dSort==='registrar'">Ordina per fornitore (registrar)</option>
                <option value="name" :selected="exp.dSort==='name'">Ordina per nome dominio</option>
                <option value="expiry" :selected="exp.dSort==='expiry'">Ordina per scadenza</option>
              </select>
              <label class="check dk-soon"><input type="checkbox" :checked="exp.dRenew==='soon'" @change="exp.dRenew=$event.target.checked?'soon':''"> Solo in scadenza entro <span x-text="prefs.expiry_warning_days"></span> giorni</label>
            </div>

            <!-- azioni in blocco -->
            <div class="selbar dk-sel" x-show="exp.dSel.length">
              <b><span x-text="exp.dSel.length"></span> <span x-text="pl(exp.dSel.length,'dominio','domini')"></span></b>
              <div class="sp"></div>
              <span class="small mut">Rinnovo:</span>

                <button type="button" class="yes" :disabled="!!(exp.busy)" @click="setRenew(exp.dSel,'yes')">Rinnova</button>

                <button type="button" class="no" :disabled="!!(exp.busy)" @click="setRenew(exp.dSel,'no')">Non rinnova</button>
              </div>
              <button class="btn sm" :disabled="!!(exp.busy)" @click="refreshWhois(exp.dSel)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg> Aggiorna WHOIS</button>
              <button class="btn sm ghost" @click="dSelNone()">Annulla</button>
            </div>

            <!-- elenco: per cartella, per fornitore, per nome o per scadenza -->
            <div class="tbl-wrap"><table class="tbl responsive dk-tbl"><thead><tr>
              <th style="width:36px"><input type="checkbox" :checked="domainRows().length && domainRows().every(d=>exp.dSel.includes(d.name))" @change="$event.target.checked ? dSelAll() : dSelNone()" title="Seleziona tutti quelli mostrati"></th>
              <th class="sortable" @click="tSort('dom','name')">Dominio<span x-text="tMark('dom','name')"></span></th><th class="sortable" @click="tSort('dom','site')">Sito<span x-text="tMark('dom','site')"></span></th><th class="sortable" @click="tSort('dom','exp')">Scadenza<span x-text="tMark('dom','exp')"></span></th><th class="sortable" @click="tSort('dom','renew')">Rinnovo<span x-text="tMark('dom','renew')"></span></th><th style="width:44px"></th></tr></thead>
              <template x-for="g in domainGroups()" :key="'g'+g.name">
                <tbody>
                  <tr class="dk-group" x-show="g.name"><td colspan="6">
                    <template x-if="g.kind==='folder'"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></template>
                    <template x-if="g.kind==='registrar'"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/></svg></template>
                    <b x-text="g.name" :translate="g.system ? 'yes' : 'no'"></b><span class="mut"> · <span x-text="g.rows.length"></span> <span x-text="pl(g.rows.length,'dominio','domini')"></span></span>
                    <span class="badge warn" x-show="g.rows.filter(x=>!x.renew).length"><span x-text="g.rows.filter(x=>!x.renew).length"></span> da decidere</span>
                  </td></tr>
                  <template x-for="x in tSorted('dom', g.rows)" :key="g.name+x.id">
                    <tr :class="exp.dSel.includes(x.name)?'sel':''">
                      <td><input type="checkbox" :checked="exp.dSel.includes(x.name)" @change="dToggle(x.name)"></td>
                      <td><div class="dk-name mono" x-text="x.name" translate="no"></div>
                        <div class="dk-reg" :class="x.registrar ? '' : 'none'" :title="validNs(x) ? 'Nameserver: ' + validNs(x) : ''">
                          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/></svg><span x-text="x.registrar || 'Registrar non rilevato'" :translate="x.registrar ? 'no' : 'yes'"></span>
                        </div></td>
                      <td><div x-text="x.site_names?.join(', ')" translate="no"></div>
                        <div class="small mut" x-show="x.site_count>1"><span x-text="x.site_count"></span> siti sullo stesso dominio</div></td>
                      <td>
                        <div class="dk-date" x-text="x.expires_at ? fmtDay(x.expires_at) : 'Non disponibile'"></div>
                        <span x-show="x.days!==null || x.error" class="badge" :class="x.error || x.renewal_pending ? 'warn' : expiryDaysClass(x.days)" x-text="x.error ? 'Data da verificare' : x.renewal_pending ? 'Rinnovo in corso' : expiryDaysText(x.days)"></span>
                        <div class="small warn" x-show="x.error" x-text="x.error"></div>
                        <details class="small mut" style="margin-top:6px;max-width:290px" x-show="x.source_summary?.sources?.length">
                          <summary style="cursor:pointer;padding:5px 0"><span>Confronto fonti</span> <span x-show="x.source_summary?.selected" x-text="'· '+(x.source_summary?.selected || '')" translate="no"></span></summary>

                              <div x-text="src.expires_at ? fmtDay(src.expires_at) : 'Non disponibile'"></div>
                              <div x-show="src.updated_at"><span>Record aggiornato</span>: <span x-text="fmtDate(src.updated_at)"></span></div>
                              <div x-show="src.snapshot_at"><span>Dati rilevati</span>: <span x-text="fmtDate(src.snapshot_at)"></span></div>
                              <div x-show="src.error" x-text="src.error" style="overflow-wrap:anywhere"></div>
                            </div>
                          </template>
                          <div style="padding:5px 0" x-show="x.renewal_pending">Periodo tecnico di rinnovo: la nuova scadenza non è ancora pubblicata.</div>
                        </details>
                      </td>
                      <td>
                        <div class="rn">
                          <button type="button" class="yes" :class="x.renew==='yes'?'on':''" :disabled="!!(exp.busy)" @click="setRenew([x.name],'yes')">Rinnova</button>
                          <button type="button" class="todo" :class="!x.renew?'on':''" :disabled="!!(exp.busy)" @click="setRenew([x.name],'')">Da decidere</button>
                          <button type="button" class="no" :class="x.renew==='no'?'on':''" :disabled="!!(exp.busy)" @click="setRenew([x.name],'no')">Non rinnova</button>
                        </div>
                        <div class="dk-note">
                          <span class="small mut" x-show="x.renew_note" x-text="x.renew_note" translate="no"></span>
                          <a href="#" class="small" @click.prevent="editRenewNote(x)" x-text="x.renew_note ? 'modifica nota' : '+ nota'"></a>
                        </div>
                      </td>
                      <td><button class="btn sm icon ghost" :disabled="!!(exp.busy)" @click="refreshWhois([x.name])"
                                  :title="'Confronta tutte le fonti · ultimo controllo '+fmtDate(x.checked_at)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button></td>
                    </tr>
                  </template>
                </tbody>
              </template>
            </table>
              <div class="empty" x-show="!exp.loadingDomains&&!domainRows().length">Nessun dominio corrisponde ai filtri.</div>
            </div>
          </div>
        </template>

        <!-- ===== SCADENZE PLUGIN / TEMI ===== -->
        <template x-if="route.page==='component-expiries'">
          <div>
            <div class="row" style="flex-wrap:wrap"><div><h1 class="page-title">Scadenze plugin / temi</h1><div class="page-sub">Registro globale delle licenze. Non sono associate a un singolo sito: indichi solo se valgono per WordPress, Joomla o entrambi.</div></div><div class="sp"></div><span class="spinner" x-show="exp.loadingComponents"></span><button class="btn sm primary" @click="newExpiry()">+ Plugin / tema / licenza</button></div>
            <div class="grid kpi" style="margin:18px 0">
              <div class="card kpi acc"><div class="k">Licenze registrate</div><div class="v" x-text="exp.components.length"></div></div>
              <div class="card kpi warn"><div class="k" x-text="'Entro '+prefs.expiry_warning_days+' giorni'"></div><div class="v" x-text="exp.components.filter(x=>x.days!==null&&x.days>=0&&x.days<=prefs.expiry_warning_days).length"></div></div>
              <div class="card kpi err"><div class="k">Scadute</div><div class="v" x-text="exp.components.filter(x=>x.days!==null&&x.days<0).length"></div></div>
