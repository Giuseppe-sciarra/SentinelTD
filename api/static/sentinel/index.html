                    </div>

                    <div x-show="notif.tab==='subject'">
                      <div class="field" style="margin:0"><label>Oggetto dell'email</label><input id="nf_subject" class="input" x-model="notif.edit.subject" @input.debounce.350ms="previewNotif()" placeholder="Oggetto email"></div>
                    </div>

                    <div x-show="notif.tab!=='subject' && !notif.source">
                      <div class="wys-toolbar">
                        <button type="button" title="Grassetto" @click="formatNotif('bold')"><b>B</b></button>
                        <button type="button" title="Corsivo" @click="formatNotif('italic')"><i>I</i></button>
                        <button type="button" title="Sottolineato" x-show="notif.tab==='email'" @click="formatNotif('underline')"><u>U</u></button>
                        <span class="wys-sep"></span>
                        <button type="button" title="Allinea a sinistra" x-show="notif.tab==='email'" @click="formatNotif('justifyLeft')">≡</button>
                        <button type="button" title="Centra" x-show="notif.tab==='email'" @click="formatNotif('justifyCenter')">≡</button>
                        <button type="button" title="Allinea a destra" x-show="notif.tab==='email'" @click="formatNotif('justifyRight')">≡</button>
                        <span class="wys-sep" x-show="notif.tab==='email'"></span>
                        <button type="button" title="Elenco puntato" x-show="notif.tab==='email'" @click="formatNotif('insertUnorderedList')">• Lista</button>
                        <button type="button" title="Elenco numerato" x-show="notif.tab==='email'" @click="formatNotif('insertOrderedList')">1. Lista</button>
                        <span class="wys-sep"></span>
                        <button type="button" title="Inserisci link" @click="notifLink()">🔗 Link</button>
                        <label class="wys-color" x-show="notif.tab==='email'" title="Colore testo"><span>A</span><input type="color" value="#172033" @input="notifColor($event.target.value)"></label>
                        <button type="button" title="Rimuovi formattazione" @click="formatNotif('removeFormat')">Tx</button>
                      </div>

                      <div x-show="notif.tab==='email'" class="wys-shell email-shell">
                        <div class="wys-email-subject"><span class="mut">Oggetto:</span> <b x-text="notif.edit&&notif.edit.subject"></b></div>
                        <div id="nf_visual_email" class="wys-editor email-editor" contenteditable="true" spellcheck="true"
                             x-init="$nextTick(() => loadNotifEditors(true))"
                             @focus="notifRememberSelection('email')" @keyup="notifRememberSelection('email')" @mouseup="notifRememberSelection('email')"
                             @input.debounce.300ms="notifEditorInput('email')"></div>
                      </div>

                      <div x-show="notif.tab==='telegram'" class="tg-editor-wrap">
                        <div class="tg-phone">
                          <div class="tg-top">Telegram · Sentinel TD</div>
                          <div id="nf_visual_telegram" class="wys-editor telegram-editor" contenteditable="true" spellcheck="true"
                               x-init="$nextTick(() => loadNotifEditors(true))"
                               @focus="notifRememberSelection('telegram')" @keyup="notifRememberSelection('telegram')" @mouseup="notifRememberSelection('telegram')"
                               @input.debounce.300ms="notifEditorInput('telegram')"></div>
                        </div>
                        <div class="small mut" style="margin-top:7px">Telegram supporta grassetto, corsivo, codice e link. Le altre formattazioni vengono semplificate automaticamente.</div>
                      </div>
                    </div>

                    <div x-show="notif.tab!=='subject' && notif.source">
                      <div class="msg info" style="margin-top:0">Modalità avanzata: qui puoi intervenire sul codice. Tornando al visuale l'editor viene aggiornato automaticamente.</div>
                      <textarea id="nf_body_email" class="input mono" rows="18" x-show="notif.tab==='email'" x-model="notif.edit.body_email" @input.debounce.350ms="previewNotif()"></textarea>
                      <textarea id="nf_body_telegram" class="input mono" rows="14" x-show="notif.tab==='telegram'" x-model="notif.edit.body_telegram" @input.debounce.350ms="previewNotif()"></textarea>
                    </div>

                    <div class="row" style="margin-top:14px;flex-wrap:wrap">
                      <button class="btn primary" :disabled="!!(notif.busy||!notifDirty)" @click="saveNotif()">Salva modifiche</button>
                      <button class="btn" :disabled="!!(notif.busy)" @click="testNotif()">Invia test reale</button>
                      <button class="btn ghost" @click="resetNotif()">Ripristina default</button>
                      <div class="sp"></div>
                      <span class="msg ok" style="margin:0" x-show="notif.msg" x-text="notif.msg"></span><span class="msg err" style="margin:0" x-show="notif.err" x-text="notif.err"></span>
                    </div>
                  </div>

                  <div class="card notif-preview-card" x-show="notif.preview">
                    <div class="row" style="flex-wrap:wrap;margin-bottom:12px">
                      <div><h3 style="margin:0 0 3px">Anteprima reale</h3><div class="small mut">Dati di esempio già sostituiti: questo è l'aspetto finale del messaggio.</div></div>
                      <div class="sp"></div>
                      <div class="tabs preview-tabs" style="margin:0"><button :class="notif.previewTab==='email'?'on':''" @click="notif.previewTab='email'">Email</button><button :class="notif.previewTab==='telegram'?'on':''" @click="notif.previewTab='telegram'">Telegram</button></div>
                    </div>
                    <div class="msg err" x-show="notif.preview&&notif.preview.error" x-text="notif.preview&&notif.preview.error"></div>

                    <div x-show="notif.previewTab==='email'" class="mail-preview">
                      <div class="mail-meta"><div><span>Da</span><b>Sentinel TD</b></div><div><span>Oggetto</span><b x-text="notif.preview&&notif.preview.subject"></b></div></div>
                      <iframe class="notif-email-frame" sandbox="allow-same-origin" :srcdoc="emailPreviewDoc()" title="Anteprima email" @load="fitFrame($event.target, 200, 2400)"></iframe>
                    </div>

                    <div x-show="notif.previewTab==='telegram'" class="tg-preview-stage">
                      <div class="tg-preview-phone">
                        <div class="tg-preview-head"><div class="tg-avatar">S</div><div><b>Sentinel TD</b><div class="small">bot</div></div></div>
                        <div class="tg-bubble" x-html="notif.preview&&notif.preview.body_telegram"></div>
                        <div class="tg-time">ora ✓✓</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              </template>
            </div>
          </div>
        </template>

        <!-- ===== ACCOUNT ===== -->
        <template x-if="route.page==='account'">
          <div>
            <h1 class="page-title">Account</h1>
            <div class="page-sub">Credenziali e sicurezza dell'accesso a Sentinel TD.</div>
            <div class="grid two" style="margin-top:16px">
              <div class="card">
                <h3>Credenziali</h3>
                <div class="field"><label>Username</label><div class="row"><input class="input" x-model="account.username" placeholder="admin"><button class="btn sm" @click="saveUsername()">Salva</button></div></div>
                <div class="field"><label>Cambia password</label><input class="input" type="password" x-model="account.oldPw" placeholder="Password attuale" style="margin-bottom:6px"><div class="row"><input class="input" type="password" x-model="account.newPw" placeholder="Nuova password"><button class="btn sm" @click="savePassword()">Salva</button></div></div>
                <div class="msg ok" x-show="account.msg" x-text="account.msg"></div><div class="msg err" x-show="account.err" x-text="account.err"></div>
              </div>
              <div class="card">
                <h3>Verifica in due passaggi</h3>
                <div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><div style="flex:1"><b>Authenticator (TOTP)</b><div class="small mut">Google Authenticator, Authy, 1Password…</div></div><span class="badge" :class="sec2fa.totp?'ok':''" x-text="sec2fa.totp?'attivo':'non attivo'"></span><button class="btn sm" x-show="!sec2fa.totp&&!sec2fa.setup" @click="totpSetup()">Configura</button><button class="btn sm danger" x-show="sec2fa.totp" @click="totpDisable()">Disattiva</button></div>
                <template x-if="sec2fa.setup"><div style="padding:12px 0;border-bottom:1px solid var(--bd)"><div class="small mut" style="margin-bottom:8px">Inquadra il QR con l'app, poi inserisci il codice per confermare.</div><div style="background:#fff;border-radius:10px;padding:10px;width:190px" x-html="sec2fa.setup.qr_svg"></div><div class="small mut" style="margin:8px 0">Chiave manuale: <span class="mono" x-text="sec2fa.setup.secret"></span></div><div class="row"><input class="input mono" x-model="sec2fa.code" placeholder="123456" inputmode="numeric" style="max-width:160px"><button class="btn sm primary" @click="totpEnable()">Attiva</button><button class="btn sm ghost" @click="sec2fa.setup=null">Annulla</button></div></div></template>
                <div class="row" style="padding:8px 0"><div style="flex:1"><b>Passkey</b><div class="small mut">Face ID, Touch ID, Windows Hello, chiavi hardware</div></div><button class="btn sm" @click="passkeyRegister()">+ Aggiungi</button></div>
                <template x-for="p in sec2fa.passkeys" :key="p.id"><div class="row small" style="padding:5px 0 5px 12px"><span style="flex:1" x-text="p.label"></span><button class="btn sm ghost danger" @click="passkeyDelete(p.id)">rimuovi</button></div></template>
                <div class="msg ok" x-show="sec2fa.msg" x-text="sec2fa.msg"></div><div class="msg err" x-show="sec2fa.err" x-text="sec2fa.err"></div>
              </div>
            </div>
          </div>
        </template>

        <!-- ===== SETTINGS (ULTIMA VOCE MENU) ===== -->
        <template x-if="route.page==='settings'">
          <div>
            <h1 class="page-title">Impostazioni</h1>
            <div class="page-sub">Configurazione operativa di Sentinel TD. Password, token SMTP e segreti restano fuori da questa pagina.</div>
            <div class="card" style="margin-top:16px" x-show="!prefsLoaded"><span class="spinner"></span> Caricamento delle impostazioni… se il pannello si sta aggiornando ci vuole qualche secondo, riprova da solo.</div>
            <div class="grid two" style="margin-top:16px" x-show="prefsLoaded">
              <div>
                <div class="card">
                  <h3>Scadenze e avvisi</h3>
                  <div class="field"><label>Avvisi scadenza domini</label><input class="input" x-model="prefs.domain_alert_text" placeholder="30, 14, 7"><div class="hint">Giorni prima della scadenza, separati da virgola. Esempio: 60, 30, 14, 7.</div></div>
                  <div class="field"><label>Avvisi plugin / temi / licenze</label><input class="input" x-model="prefs.component_alert_text" placeholder="30, 14, 7"><div class="hint">Puoi usare soglie diverse da quelle dei domini.</div></div>
                  <div class="grid two compact-grid">
                    <div class="field"><label>Riscansiona registri ogni</label><div class="input-suffix"><input class="input" type="number" min="1" max="90" x-model.number="prefs.domain_scan_days"><span>giorni</span></div><div class="hint">I domini scaduti o in scadenza entro 30 giorni si ricontrollano ogni giorno, così un rinnovo compare subito.</div></div>
                    <div class="field"><label>Pausa tra i domini</label><div class="input-suffix"><input class="input" type="number" min="5" max="600" x-model.number="prefs.domain_pause_seconds"><span>secondi</span></div><div class="hint">Un dominio alla volta. La pausa vale anche per i controlli manuali e automatici eseguiti insieme.</div></div>
                    <div class="field"><label>Tentativi per fonte WHOIS</label><div class="input-suffix"><input class="input" type="number" min="1" max="3" x-model.number="prefs.domain_source_attempts"><span>tentativi</span></div><div class="hint">Timeout e problemi temporanei: nuovi tentativi dopo 15 e 30 secondi. CAPTCHA e domini non trovati restano segnalati.</div></div>
                    <div class="field"><label>Chiedi la decisione di rinnovo</label><div class="input-suffix"><input class="input" type="number" min="0" max="3650" x-model.number="prefs.domain_decision_days"><span>giorni prima</span></div><div class="hint">Per i domini ancora "da decidere" arriva un avviso in anticipo, così c'è tempo di sentire il cliente. 0 lo disattiva.</div><label class="check" style="margin-top:10px"><input type="checkbox" :checked="prefs.domain_alert_norenew===1" @change="prefs.domain_alert_norenew=$event.target.checked?1:0"> Avvisa anche per i domini da non rinnovare</label><div class="hint">Utile per ricordare al cliente che quel dominio scadrà e non verrà rinnovato.</div></div>
                    <div class="field"><label>Conserva la cronologia dettagliata per</label><div class="input-suffix"><input class="input" type="number" min="7" max="3650" x-model.number="prefs.history_retention_days"><span>giorni</span></div><div class="hint">Serve al report dettagliato ("dalla versione X alla Y" per ogni aggiornamento). I totali mensili restano per sempre.</div></div>
                    <div class="field"><label>Email dei report di aggiornamento</label><select class="input" x-model="prefs.email_report_mode"><option value="site" :selected="prefs.email_report_mode==='site'">Un'email per ogni sito</option><option value="cycle" :selected="prefs.email_report_mode==='cycle'">Un riepilogo unico per ciclo</option></select><div class="hint">Con il riepilogo unico arriva una sola email a fine ciclo, con tutti i siti aggiornati, invece di una per sito. Telegram non cambia.</div></div>
                    <label class="check" style="padding:4px 0 10px;grid-column:1/-1"><input type="checkbox" x-model="prefs.auto_rollback"> Ripristino automatico: se la home si rompe dopo un aggiornamento, rimetti le copie fatte prima e blocca quei componenti</label>
                    <div class="field"><label>Tentativi totali per un check del sito</label><input class="input" type="number" min="1" max="5" x-model.number="prefs.status_check_attempts"><div class="hint">Comprende il primo controllo. 1 = nessun retry; 3 = primo controllo più 2 retry.</div></div>
                    <div class="field"><label>Pausa tra i retry del sito</label><div class="input-suffix"><input class="input" type="number" min="1" max="60" x-model.number="prefs.status_check_retry_seconds"><span>secondi</span></div><div class="hint">Vale per errori di connessione e DNS temporanei. I timeout di lettura passano al ricontrollo successivo, evitando richieste duplicate.</div></div>
                    <div class="field"><label>Avvisa che un sito non risponde dopo</label><div class="input-suffix"><input class="input" type="number" min="0" max="120" x-model.number="prefs.offline_alert_minutes"><span>minuti</span></div><div class="hint">Un sito che non risponde viene ricontrollato ogni minuto: l'avviso parte solo se resta irraggiungibile per tutto questo tempo, e nel frattempo nel pannello non diventa rosso. 0 = avviso immediato.</div></div>
                    <div class="field"><label>Aggiorna anteprime siti ogni</label><div class="input-suffix"><input class="input" type="number" min="1" max="720" x-model.number="prefs.screenshot_every_hours"><span>ore</span></div>
                      <button class="btn sm" style="margin-top:6px" @click="shootBulk(false)">🖼 Rigenera tutte adesso</button></div>
                    <div class="field"><label>Soglia gialla</label><div class="input-suffix"><input class="input" type="number" min="1" x-model.number="prefs.expiry_warning_days"><span>giorni</span></div></div>
                    <div class="field"><label>Soglia rossa</label><div class="input-suffix"><input class="input" type="number" min="1" x-model.number="prefs.expiry_critical_days"><span>giorni</span></div></div>
                  </div>
                  <div class="row" style="margin-top:8px"><button class="btn primary" :disabled="!!(prefs.busy)" @click="savePrefs()">Salva impostazioni</button><span class="msg ok" style="margin:0" x-show="prefs.msg" x-text="prefs.msg"></span><span class="msg err" style="margin:0" x-show="prefs.err" x-text="prefs.err"></span></div>
                </div>
                <div class="card" style="margin-top:16px">
                  <h3>Branding</h3>
                  <div class="brand-preview"><img :src="brand.logo_url" alt="Logo"><div><b>Logo applicazione</b><div class="small mut" x-text="brand.custom_logo?'Personalizzato':'Automatico dal logo incluso nel pacchetto'"></div></div></div>
                  <div class="row" style="margin:10px 0 18px;flex-wrap:wrap"><label class="btn sm">Scegli logo<input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" style="display:none" @change="uploadBrand('logo',$event)"></label><button class="btn sm ghost" x-show="brand.custom_logo" @click="resetBrand('logo')">Ripristina incluso</button></div>
                  <div class="brand-preview favicon-preview"><img :src="brand.favicon_url" alt="Favicon"><div><b>Favicon</b><div class="small mut" x-text="brand.custom_favicon?'Personalizzata':'Automatica dalla favicon inclusa nel pacchetto'"></div></div></div>
                  <div class="row" style="margin-top:10px;flex-wrap:wrap"><label class="btn sm">Scegli favicon<input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/x-icon" style="display:none" @change="uploadBrand('favicon',$event)"></label><button class="btn sm ghost" x-show="brand.custom_favicon" @click="resetBrand('favicon')">Ripristina inclusa</button></div>
                </div>
              </div>
              <div>
                <div class="card">
                  <h3>Connettori</h3>
                  <div class="small mut" style="margin-bottom:10px">I pacchetti installabili sono inclusi in Sentinel TD: scaricali da qui, non serve crearli. Caricane uno solo se vuoi usare una versione diversa da quella inclusa.</div>
                  <template x-for="c in conn.list" :key="c.kind">
                    <div class="conn-row">
                      <span class="cms conn-tag" :class="c.kind==='wp'?'wp':'joomla'" x-text="c.kind==='wp'?'WP':'JOOMLA'"></span>
                      <div class="conn-info">
                        <div class="conn-name" x-text="c.kind==='wp'?'td-panopticon':'plg_system_tdpanopticon'"></div>
                        <div class="small mut" x-show="c.present && c.builtin"><span x-text="'v'+c.version"></span> · incluso in Sentinel TD</div>
                        <div class="small mut" x-show="c.present && !c.builtin"><span x-show="c.version" x-text="'v'+c.version+' · '"></span><span>caricato il</span> <span x-text="fmtDate(c.mtime*1000)"></span></div>
                        <div class="small mut" x-show="!c.present">non disponibile</div>
                      </div>
                      <div class="conn-actions">
                        <button class="btn sm" x-show="rolloutOf(c.kind) && rolloutOf(c.kind).outdated" :disabled="!!(conn.rolling || inst.job)" @click="rolloutNow(c.kind)" title="Installa questa versione sui siti che ne hanno una più vecchia, in sottofondo">Aggiorna sui siti</button>
                        <button class="btn sm primary" x-show="c.present" @click="downloadConn(c.kind)">Scarica</button>
                        <label class="btn sm"><span x-text="c.builtin ? 'Carica una versione tua' : 'Sostituisci'"></span><input type="file" accept=".zip" style="display:none" :disabled="!!(conn.busy)" @change="uploadConn(c.kind,$event)"></label>
                        <button class="btn sm ghost" x-show="c.present && !c.builtin" @click="resetConn(c.kind)" title="Torna al pacchetto incluso in Sentinel TD">Usa quello incluso</button>
                      </div>
                      <div class="conn-progress" x-show="inst.job && inst.progress && conn.rolloutKind === c.kind">
                        <div class="row" style="gap:8px;flex-wrap:wrap"><span class="spinner"></span>
                          <b x-text="inst.progress ? (inst.progress.done + ' su ' + inst.progress.total + ' siti') : ''"></b>
                          <span class="small ok" x-show="inst.progress && inst.progress.ok" x-text="inst.progress ? inst.progress.ok + ' installati' : ''"></span>
                          <span class="small err" x-show="inst.progress && inst.progress.failed" x-text="inst.progress ? inst.progress.failed + ' falliti' : ''"></span>
                          <span class="small mut" x-show="inst.progress && (inst.progress.running || inst.progress.waiting)" x-text="inst.progress ? ((inst.progress.running ? inst.progress.running + ' in corso · ' : '') + inst.progress.waiting + ' in coda') : ''"></span>
                          <button class="srv-more" style="margin:0" @click="conn.rolloutOpen = !conn.rolloutOpen" x-text="conn.rolloutOpen ? 'Nascondi i siti' : 'Mostra i siti'"></button></div>
                        <div class="bar" style="margin-top:6px"><div class="bar-fill" :style="inst.progress ? 'width:' + Math.round(inst.progress.done / Math.max(1, inst.progress.total) * 100) + '%' : ''"></div></div>
                        <div class="conn-sites" x-show="conn.rolloutOpen"><template x-for="o in (inst.progress ? inst.progress.results : [])" :key="'ro'+o.site_id"><div class="small"><span class="dot" :class="o.state==='done' ? (o.ok ? 'ok' : 'err') : 'warn'" style="display:inline-block;margin-right:6px"></span><span x-text="o.site_name" translate="no"></span> <span class="mut" x-text="'— ' + instRowText(o)"></span></div></template></div>
                      </div>
                      <div class="small conn-rollout" x-show="rolloutOf(c.kind) && !(inst.job && conn.rolloutKind === c.kind)">
                          <span class="ok" x-show="rolloutOf(c.kind) && !rolloutOf(c.kind).outdated" x-text="'sui siti: tutti alla ' + (rolloutOf(c.kind)||{}).version"></span>
                          <span class="warn" x-show="rolloutOf(c.kind) && rolloutOf(c.kind).outdated" x-text="(rolloutOf(c.kind)||{}).outdated + ' ' + pl((rolloutOf(c.kind)||{}).outdated, 'sito con una versione più vecchia', 'siti con una versione più vecchia') + ' su ' + (rolloutOf(c.kind)||{}).total"></span>
                        </div>
                    </div>
                  </template>
                  <label class="check" style="padding:10px 0 0" x-show="conn.rollout"><input type="checkbox" :checked="conn.rollout && conn.rollout.auto" @change="toggleConnAuto()"> Ogni notte installa da solo il connettore nuovo sui siti che ne hanno uno vecchio (alle 4:30, un sito alla volta sui server col freno)</label>
                  <div class="msg ok" x-show="conn.msg" x-text="conn.msg"></div><div class="msg err" x-show="conn.err" x-text="conn.err"></div>
                  <h3 style="margin-top:20px">Indirizzo pubblico di questo pannello</h3>
                  <div class="small mut" style="margin-bottom:8px">Il pacchetto WordPress scaricato da qui viene generato con questo indirizzo e con la chiave qui sotto: i siti nuovi si collegano da soli, senza incollare niente. Lasciandolo vuoto il pacchetto resta neutro.</div>
                  <div class="row">
                    <input class="input" type="url" x-model="conn.hubUrl" placeholder="https://sentinel.tuodominio.it">
                    <button class="btn sm" @click="useCurrentHubUrl()">Usa questo</button>
                    <button class="btn sm primary" :disabled="!!(!hubDirty)" @click="saveHubUrl()">Salva</button>
                  </div>

                  <h3 style="margin-top:20px">Registrazione automatica (WordPress)</h3><div class="small mut" style="margin-bottom:8px">Chiave da mettere nella costante <span class="mono">TDPANOP_HUB_KEY</span> del connettore.</div><div class="row"><input class="input mono small" readonly :value="conn.regKey" onclick="this.select()"><button class="btn sm" @click="copy(conn.regKey)">Copia</button><button class="btn sm" @click="rotateKey()">Rigenera</button></div>
                </div>
                <div class="card" style="margin-top:16px">
                  <h3>Pacchetti per plugin e temi a licenza</h3>
                  <div class="small mut" style="margin-bottom:10px">Per i prodotti che un sito non riesce a scaricare dal produttore (es. Elementor Pro con licenza non attiva su quel dominio): carica qui lo zip e Sentinel lo installa sopra la versione presente, sui siti che ne hanno una più vecchia. Caricarne uno nuovo sostituisce il precedente.</div>
                  <template x-for="p in pkg.list" :key="'pk'+p.id">
                    <div class="row" style="padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap">
                      <span class="cms wp" x-text="p.kind==='theme' ? 'TEMA' : 'PLUGIN'"></span>
                      <div style="flex:1;min-width:160px">
                        <div><b x-text="p.name" translate="no"></b> <span class="mono small" x-text="p.version"></span></div>
                        <div class="small mut"><span class="mono" x-text="p.slug" translate="no"></span> · <span x-text="fmtSize(p.size)"></span> · <span x-text="fmtDate(p.uploaded_at)"></span></div>
                      </div>
                      <span class="badge" :class="p.pending_sites ? 'warn' : 'ok'" x-text="p.pending_sites ? (p.pending_sites + ' ' + pl(p.pending_sites, 'sito da aggiornare', 'siti da aggiornare')) : 'tutti aggiornati'"></span>
                      <button class="btn sm primary" x-show="p.pending_sites" :disabled="!!(pkg.busy)" @click="applyPackage(p)">Installa ora</button>
                      <button class="btn sm ghost" @click="deletePackage(p)" title="Elimina il pacchetto">✕</button>
                    </div>
                  </template>
                  <div class="small mut" x-show="!pkg.list.length" style="padding:6px 0 10px">Nessun pacchetto caricato.</div>
                  <div class="row" style="margin-top:10px">
                    <label class="btn sm"><span x-text="pkg.busy ? 'Caricamento…' : 'Carica uno zip'"></span><input type="file" accept=".zip" style="display:none" @change="uploadPackage($event)" :disabled="!!(pkg.busy)"></label>
                  </div>
                  <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--bd)">
                    <div style="margin-bottom:4px"><b>Prendi da un sito</b></div>
                    <div class="small mut" style="margin-bottom:8px">Per i prodotti a licenza: Sentinel prende lo zip dal sito WordPress che ha la versione più recente, e poi lo installa sui siti a cui il produttore non lo consegna. Serve il connettore 2.19.0 sul sito da cui si prende.</div>
                    <input class="input" placeholder="Cerca un plugin o un tema, es. Elementor Pro" x-model="pkg.q" @input.debounce.400ms="searchCandidates()">
                    <template x-for="c in pkg.cands" :key="'hc' + c.kind + c.slug">
                      <div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap">
                        <span class="cms wp" x-text="c.kind === 'theme' ? 'TEMA' : 'PLUGIN'"></span>
                        <div style="flex:1;min-width:160px">
                          <div><b x-text="c.name" translate="no"></b> <span class="mono small" x-text="c.version"></span></div>
                          <div class="small mut">dal sito <span x-text="c.site_name" translate="no"></span> · <span x-text="c.sites + ' ' + pl(c.sites, 'sito ce l\'ha', 'siti ce l\'hanno')"></span></div>
                        </div>
                        <button class="btn sm" :disabled="!!(pkg.hbusy)" @click="harvest(c)"><span class="spinner" x-show="pkg.hbusy === c.kind + c.slug"></span> Prendi</button>
                      </div>
                    </template>
                    <div class="small mut" style="padding-top:8px" x-show="pkg.q.trim().length >= 2 && !pkg.cands.length && !pkg.searching">Nessun plugin o tema trovato sui siti WordPress.</div>
                  </div>
                  <div class="msg ok" x-show="pkg.msg" x-text="pkg.msg"></div><div class="msg err" x-show="pkg.err" x-text="pkg.err"></div>
                </div>
                <div class="card" style="margin-top:16px"><h3>Notifiche</h3><div class="row"><div class="small mut" style="flex:1">Testi, HTML, anteprime e canali si modificano nella pagina <a href="#/notifications">Notifiche</a>. SMTP e token Telegram restano nel file <span class="mono">.env</span>.</div><button class="btn sm" @click="telegramTest()">Test Telegram</button></div></div>
              </div>
            </div>
            <!-- SERVER DEI SITI: sezione a tutta larghezza, sotto le due colonne -->
            <div class="sec-sep"><span>Server dei siti</span></div>
            <div class="card srv-section">
              <div class="srv-top">
                <div class="srv-intro">
                  <div class="srv-intro-title">Il freno per gli hosting deboli</div>
                  <div class="small mut">Di base Sentinel lavora su tutti i server come sempre. Sui server deboli puoi mettere il freno: lì lavora su pochi siti alla volta, aspetta tra un aggiornamento e l'altro dello stesso sito, e dopo un sito dove ha installato o aggiornato qualcosa lascia riposare il server. Il server di un sito è l'indirizzo IP del suo dominio.</div>
                </div>
                <div class="srv-controls">
                  <div class="field"><label>Siti in contemporanea su un server con il freno</label><select class="input" x-model.number="prefs.server_parallel"><template x-for="n in [1,2,3,4]" :key="'sp'+n"><option :value="n" :selected="prefs.server_parallel===n" x-text="n"></option></template></select></div>
                  <div class="field"><label>Riposo di un server con il freno dopo un sito aggiornato</label><div class="input-suffix"><input class="input" type="number" min="0" max="600" x-model.number="prefs.server_pause_seconds"><span>secondi</span></div></div>
                  <div class="field"><label>Pausa tra un aggiornamento e l'altro dello stesso sito</label><div class="input-suffix"><input class="input" type="number" min="0" max="300" x-model.number="prefs.server_item_pause_seconds"><span>secondi</span></div></div>
                  <div class="srv-save"><button class="btn primary" @click="savePrefs()" :disabled="!!(prefs.busy)">Salva</button><span class="small" :class="prefs.err ? 'err' : 'mut'" x-text="prefs.err || prefs.msg"></span></div>
                </div>
              </div>
              <datalist id="srv-labels"><template x-for="l in srvLabelList" :key="'sl'+l"><option :value="l"></option></template></datalist>
              <div class="srv-subhead"><b>Server rilevati</b><span class="small mut">Metti il freno ai server che non reggono, per esempio gli hosting condivisi dei clienti. Quelli senza freno lavorano come sempre. Dai lo stesso nome a più server per vederli come un gruppo solo nei report.</span></div>
              <div class="small mut" x-show="serversLoading">Rilevamento dei server…</div>
              <div class="srv-groups">
                <template x-for="g in serverGroups()" :key="'sg'+g.folder">
                  <div class="srv-group">
                    <div class="srv-group-head">
                      <span class="srv-group-name"><span x-show="g.folder" x-text="g.folder" translate="no"></span><span x-show="!g.folder">Senza cartella</span></span>
                      <span class="small mut" x-text="g.servers.length + ' ' + pl(g.servers.length, 'server', 'server') + ' · ' + g.sites + ' ' + pl(g.sites, 'sito', 'siti')"></span>
                    </div>
                    <template x-for="sv in g.servers" :key="'sv'+sv.server">
                      <div class="srv-row" :class="isLimited(sv.server) ? 'on' : ''">
                        <label class="srv-sw" :title="isLimited(sv.server) ? 'Freno attivo' : 'Senza freno'"><input type="checkbox" :checked="isLimited(sv.server)" @change="toggleLimited(sv.server)"><span></span></label>
                        <div style="min-width:0"><input class="input srv-name" list="srv-labels" :value="srvLabel(sv.server)" @change="setSrvLabel(sv.server, $event.target.value)" placeholder="Dai un nome" title="Nome del server, mostrato ovunque accanto all'IP (anche nei report). Più server con lo stesso nome diventano un gruppo solo. Poi Salva." x-show="sv.server && sv.server !== '?'"><span class="mono srv-ip" x-text="sv.server" translate="no"></span></div>
                        <div class="srv-mid">
                          <span class="srv-host" x-text="sv.host || '—'" translate="no"></span>
                          <span class="srv-also" x-show="srvOthers(sv, g.folder).length"><span>anche</span> <span translate="no" x-text="srvOthers(sv, g.folder).map(f => (f.name || '—') + ' (' + f.count + ')').join(', ')"></span></span>
                        </div>
                        <span class="badge warn srv-badge" x-show="isLimited(sv.server)">con il freno</span>
                        <span class="srv-num"><b x-text="sv.sites"></b> <span x-text="pl(sv.sites, 'sito', 'siti')"></span></span>
                        <button class="srv-more" @click="srvOpen[sv.server] = !srvOpen[sv.server]" x-text="srvOpen[sv.server] ? 'Nascondi i siti' : 'Mostra i siti'"></button>
                        <div class="srv-names" x-show="srvOpen[sv.server]" x-text="sv.names.join(' · ')" translate="no"></div>

                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </main>
    </div>
  </div>
</template>

<template x-if="token&&drawer==='client'&&cli.edit">
  <div><div class="overlay" @click="drawer=null"></div>
  <div class="drawer bulk" @keydown.escape.window="drawer=null">
    <div class="head"><h2 x-text="cli.edit.id ? 'Modifica cliente' : 'Nuovo cliente'"></h2><div class="sp"></div><button class="btn icon ghost" @click="drawer=null">✕</button></div>
    <div class="body">
      <div class="field"><label>Nome del cliente</label>
        <template x-if="!cli.edit.id">
        <div class="ac-wrap" @click.outside="if (cli.ac.field==='new') cli.ac.field = null">
          <input class="input" x-model="cli.edit.name" placeholder="Scrivi o scegli un gruppo, un cliente o una cartella" autocomplete="off" @focus="cliAcOpen('new')" @input="cliAcOpen('new')"
            @keydown.down.prevent="cliAcMove('new', 1)" @keydown.up.prevent="cliAcMove('new', -1)" @keydown.enter.prevent="cliAcEnter('new')"
            @keydown.escape="if (cli.ac.field) { cli.ac.field = null; $event.stopPropagation() }">
          <div class="ac-list" x-show="cli.ac.field==='new' && cliAcItems('new').length">
            <template x-for="(it, i) in cliAcItems('new')" :key="'acnew'+it.key">
              <button type="button" class="ac-item" :class="i===cli.ac.idx ? 'on' : ''" @mousedown.prevent="cliAcChoose('new', it)" @mouseenter="cli.ac.idx = i">
                <span class="ac-kind" :class="it.kind" x-text="it.kind==='folder' ? 'cartella' : (it.client.sites.length > 1 ? 'gruppo' : 'cliente')"></span>
                <span class="ac-label" x-text="it.label" translate="no"></span><span class="small mut" x-text="it.sub" translate="no"></span>
              </button>
            </template>
          </div>
        </div>
        </template>
        <template x-if="cli.edit.id"><input class="input" x-model="cli.edit.name" placeholder="Hotel Esempio srl"></template>
        <div class="ac-note" x-show="cliNewTarget"><b x-text="cliNewTarget ? cliNewTarget.name : ''" translate="no"></b> esiste già: salvando, i siti scelti e gli indirizzi scritti vengono aggiunti a quel cliente.</div></div>
      <div class="field"><label>Email per il report</label><input class="input" x-model="cli.edit.emails" placeholder="info@cliente.it, titolare@cliente.it"><div class="hint">Più indirizzi separati da virgola. Il report va solo a questi indirizzi, mai al tuo.</div></div>
      <label class="check" style="padding:4px 0 12px"><input type="checkbox" x-model="cli.edit.enabled"> Invio automatico ogni mese</label>
      <div class="field"><label>Siti del cliente · <span x-text="cli.edit.site_ids.length"></span> selezionati</label>

          <template x-for="f in cliFolders" :key="'ef'+f"><button class="chip-btn" :class="cliEditHasFolder(f) ? 'on' : ''" @click="cliEditFolder(f)" x-text="f" translate="no"></button></template></div>
        <input class="input" x-model="cli.q" placeholder="Cerca per nome, indirizzo o cartella"></div>
      <div class="cli-pick">
        <template x-for="s in cliSiteChoices" :key="'pk'+s.id">
          <label class="cli-pick-row" :class="cli.edit.site_ids.includes(s.id) ? 'on' : ''">
            <input type="checkbox" :checked="cli.edit.site_ids.includes(s.id)" @change="cliToggleSite(s.id)">

            <span style="min-width:0"><b x-text="s.name" translate="no"></b><span class="small mut" style="display:block" x-text="(s.url||'').replace(/^https?:\/\//,'') + (s.tags ? ' · ' + s.tags : '')" translate="no"></span></span>
          </label>
        </template>
      </div>
      <div class="msg err" x-show="cli.err" x-text="cli.err"></div>
    </div>
    <div class="foot"><button class="btn" @click="drawer=null">Annulla</button><button class="btn primary" @click="saveClient()" x-text="cliNewTarget ? ('Aggiungi a ' + cliNewTarget.name) : 'Salva'"></button></div>
  </div></div>
</template>

            @keydown.down.prevent="cliAcMove('from', 1)" @keydown.up.prevent="cliAcMove('from', -1)" @keydown.enter.prevent="cliAcEnter('from')"
            @keydown.escape="if (cli.ac.field) { cli.ac.field = null; $event.stopPropagation() }">
          <div class="ac-list" x-show="cli.ac.field==='from' && cliAcItems('from').length">

          </label>
        </template>
        <div class="empty" x-show="!cliFromChoices.length" x-text="cli.fromMode==='group' ? 'Nessun sito trovato.' : 'Tutti i siti hanno già un cliente.'"></div>
      </div>
      <div class="msg err" x-show="cli.err" x-text="cli.err"></div>
    </div>
    <div class="foot"><button class="btn" @click="drawer=null">Annulla</button>
      <button class="btn primary" @click="createClientsFromSites()" :disabled="!!(cliFromTarget ? !cliFromNew.length : !cli.fromSel.length)"
        x-text="cliFromTarget ? ('Aggiungi ' + cliFromNew.length + ' ' + pl(cliFromNew.length, 'sito', 'siti') + ' a ' + cliFromTarget.name)
              : (cli.fromMode==='group' ? ('Crea il cliente con ' + cli.fromSel.length + ' ' + pl(cli.fromSel.length, 'sito', 'siti')) : ('Crea ' + cli.fromSel.length + ' ' + pl(cli.fromSel.length, 'cliente', 'clienti')))"></button></div>
  </div></div>
</template>

<!-- ===================== DRAWER: UNISCI CLIENTI ===================== -->
<template x-if="token&&drawer==='clientmerge'">
  <div><div class="overlay" @click="drawer=null"></div>
  <div class="drawer" @keydown.escape.window="drawer=null">
    <div class="head"><h2>Unisci in un cliente</h2><div class="sp"></div><button class="btn icon ghost" @click="drawer=null">✕</button></div>
    <div class="body">
      <div class="hint" style="margin-bottom:12px" x-text="cli.merge.count + ' clienti diventano uno solo, con ' + cli.merge.sites + ' ' + pl(cli.merge.sites, 'sito', 'siti') + ' e un solo report che li raggruppa tutti. Gli altri clienti vengono eliminati; i siti non vengono toccati.'"></div>
      <div class="field"><label>Nome del cliente</label><input class="input" x-model="cli.merge.name"></div>
      <div class="field"><label>Email per il report</label><input class="input" x-model="cli.merge.emails" placeholder="info@cliente.it"><div class="hint">Sono già uniti gli indirizzi dei clienti scelti: togli quelli che non servono.</div></div>
      <div class="msg err" x-show="cli.err" x-text="cli.err"></div>
    </div>
    <div class="foot"><button class="btn" @click="drawer=null">Annulla</button><button class="btn primary" @click="mergeClients()">Unisci</button></div>
  </div></div>
</template>

<!-- ===================== DRAWER: REPORT DETTAGLIATO ===================== -->
<template x-if="token&&drawer==='detailrep'">
  <div><div class="overlay" @click="drawer=null"></div>
  <div class="drawer bulk" @keydown.escape.window="drawer=null">
    <div class="head">
      <div>
        <h2>Report dettagliato</h2>
        <div class="small mut">Sito per sito: quante volte è stato aggiornato ogni componente e da quale versione a quale</div>
      </div>
      <div class="sp"></div>
      <button class="btn icon ghost" @click="drawer=null" title="Chiudi">✕</button>
    </div>

    <div class="body">
      <!-- 1 · PERIODO -->
      <section class="bk-step">
        <div class="bk-h"><span class="bk-n">1</span><span>Periodo</span></div>
        <div class="chips" style="margin-bottom:12px">
          <span class="fchip" :class="drep.range==='cur'?'on':''" @click="drepRange('cur')">Questo mese</span>
          <span class="fchip" :class="drep.range==='prev'?'on':''" @click="drepRange('prev')">Mese scorso</span>
          <span class="fchip" :class="drep.range==='q3'?'on':''" @click="drepRange('q3')">Ultimi 3 mesi</span>
          <span class="fchip" :class="drep.range==='y1'?'on':''" @click="drepRange('y1')">Ultimi 12 mesi</span>
          <span class="fchip" :class="drep.range==='all'?'on':''" @click="drepRange('all')">Tutto lo storico</span>
        </div>
        <div class="bk-range">
          <div class="field"><label>Dal mese</label>
            <select class="input" x-model="drep.from" @change="drep.range=''">
              <template x-for="p in drepMonths" :key="'f'+p"><option :value="p" :selected="p===drep.from" x-text="drepMonthLabel(p)"></option></template>
            </select></div>
          <div class="bk-range-arrow">→</div>
          <div class="field"><label>Al mese</label>
            <select class="input" x-model="drep.to" @change="drep.range=''">
              <template x-for="p in drepMonths" :key="'t'+p"><option :value="p" :selected="p===drep.to" x-text="drepMonthLabel(p)"></option></template>
            </select></div>
        </div>
      </section>

      <!-- 2 · SITI -->
      <section class="bk-step">
        <div class="bk-h"><span class="bk-n">2</span><span>Quali siti</span>
          <span class="sp"></span><span class="badge" :class="drepTargetCount?'acc':''"><span x-text="drepTargetCount"></span> <span x-text="pl(drepTargetCount,'sito','siti')"></span></span></div>
        <div class="seg" style="margin-bottom:12px">
          <button type="button" :class="drep.mode==='all'?'on':''" @click="drep.mode='all'">Tutti i siti</button>
          <button type="button" :class="drep.mode==='folder'?'on':''" @click="drep.mode='folder'">Una cartella</button>
          <button type="button" :class="drep.mode==='pick'?'on':''" @click="drep.mode='pick'">Scelgo io</button>
        </div>
        <template x-if="drep.mode==='folder'">
          <div class="chips">
            <template x-for="f in drepFolders" :key="'df'+f">
              <span class="fchip" :class="drep.folder===f?'on':''" @click="drep.folder=f"><span x-text="f"></span><span class="n" x-text="folderSites(f).length"></span></span>
            </template>
          </div>
        </template>
        <template x-if="drep.mode==='pick'">
          <div>
            <div class="bk-tools">
              <div class="search"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input class="input" x-model="drep.filter" placeholder="Filtra siti…"></div>
              <button type="button" class="btn sm bk-all" @click="drepSelAll()">✓ Seleziona tutti</button>
              <button type="button" class="btn sm" @click="drepSelNone()" :disabled="!!(!drep.ids.length)">Nessuno</button>
            </div>
            <div class="bk-sites">
              <template x-for="s in drepSites()" :key="'ds'+s.id">
                <label class="bk-site" :class="drep.ids.includes(s.id)?'sel':''">
                  <input type="checkbox" :checked="drep.ids.includes(s.id)" @change="drepToggleSite(s.id)">
                  <span class="site-thumb bk-thumb">
                    <img x-show="s.shot_path" :src="thumbUrl(s)" loading="lazy" alt="" @error="$event.target.style.visibility='hidden'">
                    <span class="ini" x-show="!s.shot_path" x-text="initials(s.name)"></span><i class="thumb-flag" x-show="s.shot_blocked_at" title="Anteprima bloccata dall'antibot del sito">🛡</i>
                  </span>
                  <span class="bk-site-txt"><span class="name" x-text="s.name" translate="no"></span><span class="url" x-text="s.url.replace(/^https?:\/\//,'')" translate="no"></span></span>
                  <span class="cms" :class="s.cms" x-text="s.cms==='wp'?'WP':'J'"></span>
                </label>
              </template>
              <div class="empty" x-show="!drepSites().length" style="padding:18px">Nessun sito corrisponde al filtro</div>
            </div>
          </div>
        </template>
      </section>

      <!-- 3 · CONTENUTO E FORMATO -->
      <section class="bk-step">
        <div class="bk-h"><span class="bk-n">3</span><span>Contenuto e formato</span></div>
        <label class="check bk-opt"><input type="checkbox" checked disabled> <span><b>Riepilogo per componente</b><span class="small mut">quante volte è stato aggiornato e da quale versione a quale</span></span></label>
        <label class="check bk-opt"><input type="checkbox" x-model="drep.history"> <span><b>Cronologia di ogni singolo aggiornamento</b><span class="small mut">data, versioni ed esito — il report diventa più lungo</span></span></label>
        <label class="check bk-opt"><input type="checkbox" x-model="drep.failed"> <span><b>Includi gli aggiornamenti non riusciti</b><span class="small mut">con il motivo dell'errore</span></span></label>
        <div class="bk-opts">
          <div class="seg">
            <button type="button" :class="drep.format==='pdf'?'on':''" @click="drep.format='pdf'">PDF</button>
            <button type="button" :class="drep.format==='csv'?'on':''" @click="drep.format='csv'">CSV (Excel)</button>
          </div>
        </div>
      </section>
    </div>

    <div class="foot bk-foot">
      <div class="bk-summary" :class="drepCanRun?'ready':''" x-text="drepSummary"></div>
      <button class="btn" @click="drawer=null">Chiudi</button>
      <button class="btn primary" :disabled="!!(!drepCanRun)" @click="downloadDetailReport()">
        <span class="spinner" x-show="drep.busy"></span> <span><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg> Scarica</span>
      </button>
    </div>
  </div></div>
</template>

<!-- ===================== DRAWER: INSTALLA / RIMUOVI (flusso guidato) ===================== -->
<template x-if="token&&drawer==='install'">
  <div><div class="overlay" @click="drawer=null"></div>
  <div class="drawer bulk" @keydown.escape.window="drawer=null">
    <div class="head">
      <div>
        <h2>Operazioni in blocco</h2>
        <div class="small mut" x-text="inst.mode==='install' ? 'Carica un pacchetto su più siti insieme' : 'Togli un\'estensione da più siti insieme'"></div>
      </div>
      <div class="sp"></div>
      <div class="seg bk-mode">
        <button :class="inst.mode==='install'?'on':''" @click="instSetMode('install')">Installa</button>
        <button :class="inst.mode==='remove'?'on':''" @click="instSetMode('remove')">Rimuovi</button>
      </div>
      <button class="btn icon ghost" @click="drawer=null" title="Chiudi">✕</button>
    </div>

    <div class="body">
      <!-- 1 · PIATTAFORMA -->
      <section class="bk-step">
        <div class="bk-h"><span class="bk-n">1</span><span>Piattaforma</span></div>
        <div class="bk-plat">
          <button type="button" :class="inst.cms==='wp'?'on':''" @click="instSetCms('wp')">
            <span class="cms wp">WP</span><span class="bk-plat-name">WordPress</span><span class="bk-cnt"><span x-text="instCmsCount('wp')"></span> <span x-text="pl(instCmsCount('wp'),'sito','siti')"></span></span>
          </button>
          <button type="button" :class="inst.cms==='joomla'?'on':''" @click="instSetCms('joomla')">
            <span class="cms joomla">J</span><span class="bk-plat-name">Joomla</span><span class="bk-cnt"><span x-text="instCmsCount('joomla')"></span> <span x-text="pl(instCmsCount('joomla'),'sito','siti')"></span></span>
          </button>
        </div>
      </section>

      <!-- 2 · COSA INSTALLARE -->
      <template x-if="inst.mode==='install'">
        <section class="bk-step">
          <div class="bk-h"><span class="bk-n">2</span><span>Cosa installare</span></div>
          <label class="bk-drop" :class="{ over: inst.drag, has: inst.file }"
                 @dragover.prevent="inst.drag=true" @dragleave.prevent="inst.drag=false" @drop.prevent="instDrop($event)">
            <input type="file" accept=".zip" style="display:none" @change="inst.file=$event.target.files[0]">
            <template x-if="!inst.file">
              <div class="bk-drop-empty">
                <div class="bk-drop-ico">⇪</div>
                <b>Trascina qui lo zip</b>
                <span class="small mut">oppure clicca per sceglierlo</span>
              </div>
            </template>
            <template x-if="inst.file">
              <div class="bk-drop-file">
                <div class="bk-drop-ico">▣</div>
                <div class="bk-drop-meta"><b x-text="inst.file.name" translate="no"></b><span class="small mut" x-text="Math.max(1, Math.round(inst.file.size/1024))+' KB'"></span></div>
                <button type="button" class="btn sm" @click.prevent.stop="inst.file=null">Cambia</button>
              </div>
            </template>
          </label>
          <div class="bk-opts" x-show="inst.cms==='wp'">
            <div class="seg">
              <button type="button" :class="inst.kind==='plugin'?'on':''" @click="inst.kind='plugin'">Plugin</button>
              <button type="button" :class="inst.kind==='theme'?'on':''" @click="inst.kind='theme'">Tema</button>
            </div>
            <label class="check"><input type="checkbox" x-model="inst.activate"> Attiva dopo l'installazione</label>
          </div>
        </section>
      </template>

      <!-- 2 · COSA RIMUOVERE -->
      <template x-if="inst.mode==='remove'">
        <section class="bk-step">
          <div class="bk-h"><span class="bk-n">2</span><span>Cosa rimuovere</span>
            <span class="sp"></span><span class="badge acc" x-show="inst.rmItems.length" x-text="inst.rmItems.length+' '+pl(inst.rmItems.length,'scelta','scelte')"></span></div>
          <div class="search"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input class="input" x-model="inst.q" @input.debounce.350ms="instSearch(true)" @keydown.enter.prevent="instSearch()" placeholder="Cerca per nome o slug">
          </div>
          <div class="empty" x-show="inst.searched&&!inst.results.length" style="padding:18px">Nessun risultato</div>
          <div class="bk-results" x-show="inst.results.length">
            <template x-for="r in inst.results" :key="r.type+'|'+r.slug">
              <div class="bk-ext" :class="{ sel: instSelected(r), prot: r.protected }">
                <label class="bk-ext-main">
                  <input type="checkbox" :disabled="!!(r.protected)" :checked="instSelected(r)" @change="instToggle(r)">
                  <div class="bk-ext-info">
                    <div class="bk-ext-title"><b x-text="r.name" translate="no"></b><span class="badge" x-text="r.type"></span><span class="badge" x-show="r.protected">protetto</span></div>
                    <div class="mono small mut" x-text="r.slug"></div>
                    <div class="small" x-show="(r.versions||[]).length"><span class="mut">versione:</span> <span x-text="(r.versions||[]).map(v=>'v'+v).join(' · ')"></span> <span class="badge warn" x-show="(r.versions||[]).length>1">miste</span></div>
                  </div>
                  <button type="button" class="btn sm" @click.prevent.stop="instToggleOpen(r)"><span x-text="'su '+r.count+' '+pl(r.count,'sito','siti')"></span> <span x-text="instIsOpen(r)?'▴':'▾'"></span></button>
                </label>
                <div class="bk-ext-sites" x-show="instIsOpen(r)">
                  <template x-for="d in (r.site_details||[])" :key="d.id">
                    <div class="row small"><span style="flex:1" x-text="d.name" translate="no"></span><span class="mono" x-text="d.version?'v'+d.version:'—'"></span><span class="badge warn" x-show="d.update_available" x-text="'→ '+(d.new_version||'update')"></span></div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </section>
      </template>

      <!-- 3 · SU QUALI SITI -->
      <section class="bk-step">
        <div class="bk-h"><span class="bk-n">3</span><span>Su quali siti</span>
          <span class="sp"></span>
          <span class="badge" :class="inst.sel.length?'acc':''" x-show="inst.mode==='install'||inst.rmItems.length" x-text="inst.sel.length+' / '+instSites().length+' selezionati'"></span>
        </div>
        <template x-if="inst.mode==='remove'&&!inst.rmItems.length">
          <div class="empty bk-hint">Scegli prima un'estensione: qui compariranno solo i siti che la hanno.</div>
        </template>
        <template x-if="inst.mode==='install'||inst.rmItems.length">
          <div>
            <div class="bk-tools">
              <div class="search"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input class="input" x-model="inst.siteFilter" placeholder="Filtra siti…"></div>
              <button type="button" class="btn sm bk-all" @click="instSelAll()">✓ Seleziona tutti</button>
              <button type="button" class="btn sm" @click="instSelNone()" :disabled="!!(!inst.sel.length)">Nessuno</button>
            </div>
            <div class="chips bk-folders" x-show="instFolders().length>1">
              <span class="small mut">Cartelle:</span>
              <template x-for="f in instFolders()" :key="f.tag">
                <span class="fchip" :class="instFolderOn(f.tag)?'on':''" @click="instToggleFolder(f.tag)"><span x-text="f.tag" translate="no"></span><span class="n" x-text="f.count"></span></span>
              </template>
            </div>
            <div class="bk-sites">
              <template x-for="s in instVisibleSites()" :key="s.id">
                <label class="bk-site" :class="inst.sel.includes(s.id)?'sel':''">
                  <input type="checkbox" :checked="inst.sel.includes(s.id)" @change="instToggleSite(s.id)">
                  <span class="site-thumb bk-thumb">
                    <img x-show="s.shot_path" :src="thumbUrl(s)" loading="lazy" alt="" @error="$event.target.style.visibility='hidden'">
                    <span class="ini" x-show="!s.shot_path" x-text="initials(s.name)"></span><i class="thumb-flag" x-show="s.shot_blocked_at" title="Anteprima bloccata dall'antibot del sito">🛡</i>
                  </span>
                  <span class="bk-site-txt"><span class="name" x-text="s.name" translate="no"></span><span class="url" x-text="s.url.replace(/^https?:\/\//,'')" translate="no"></span></span>
                  <span class="mono small mut" x-show="inst.mode==='remove'" x-text="instSiteVersion(s)"></span>
                  <span class="dot" :class="statusTone(s)" :title="statusTitle(s)"></span>
                </label>
              </template>
              <div class="empty" x-show="!instVisibleSites().length" style="padding:18px">Nessun sito corrisponde al filtro</div>
            </div>
          </div>
        </template>
      </section>

      <!-- ESITO -->
      <template x-if="inst.out.length">
        <section class="bk-step">
          <div class="bk-h"><span class="bk-n ok">✓</span><span>Esito</span>
            <span class="sp"></span>
            <span class="badge ok" x-show="instOutCount('ok')" x-text="instOutCount('ok')+' '+pl(instOutCount('ok'),'riuscito','riusciti')"></span>
            <span class="badge err" x-show="instOutCount('err')" x-text="instOutCount('err')+' '+pl(instOutCount('err'),'fallito','falliti')"></span>
            <span class="badge" x-show="instOutCount('skip') && !inst.progress" x-text="instOutCount('skip')+' '+pl(instOutCount('skip'),'saltato','saltati')"></span>
            <span class="badge warn" x-show="inst.progress && !inst.progress.finished" x-text="inst.progress ? (inst.progress.done + ' di ' + inst.progress.total + ' completati') : ''"></span>
            <span class="badge warn" x-show="inst.progress && inst.progress.retrying" x-text="inst.progress ? (inst.progress.retrying + ' ' + pl(inst.progress.retrying, 'in nuovo tentativo', 'in nuovo tentativo')) : ''"></span>
          </div>
          <div class="small mut" style="margin:-4px 0 10px" x-show="inst.progress && !inst.progress.finished">L'installazione continua anche se cambi pagina o chiudi il browser.</div>
          <div class="bk-out">
            <template x-for="(o,i) in inst.out" :key="i">
              <div class="bk-out-row" :class="(o.skipped || (o.state && o.state !== 'done')) ? 'skip' : (o.ok ? 'ok' : 'err')">
                <span class="dot" :class="(o.skipped || (o.state && o.state !== 'done')) ? 'mut' : (o.ok ? 'ok' : 'err')"></span>
                <b x-text="o.site||o.site_name||o.name||''" translate="no"></b>
                <span x-text="instRowText(o)"></span>
              </div>
            </template>
          </div>
        </section>
      </template>
    </div>

    <div class="foot bk-foot">
      <div class="bk-summary" :class="instCanRun?'ready':''" x-text="instSummary"></div>
      <button class="btn" @click="drawer=null">Chiudi</button>
      <button class="btn" :class="inst.mode==='remove'?'danger-solid':'primary'" :disabled="!!(!instCanRun)"
              @click="inst.mode==='install'?runInstall():runRemove()">
        <span class="spinner" x-show="inst.busy"></span>
        <span x-text="inst.mode==='install'?'Installa':'Rimuovi'"></span>
      </button>
    </div>
  </div></div>
</template>

<!-- anteprima report a tutta pagina -->
<template x-if="token&&previewFull">
  <div><div class="overlay" @click="previewFull=''"></div>
  <div style="position:fixed;inset:24px;z-index:43;background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)" @keydown.escape.window="previewFull=''">
    <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-2);border-bottom:1px solid var(--bd)">
      <b style="flex:1;font-size:13px">Anteprima report</b>
      <button class="btn sm" @click="openTokenLink(() => reportPdfUrl())"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg> PDF</button>
      <button class="btn sm ghost" @click="previewFull=''">✕ Chiudi</button>
    </div>
    <iframe :srcdoc="previewFull" sandbox="allow-same-origin" style="flex:1;width:100%;border:0;background:#fff"></iframe>
  </div></div>
</template>

<div class="toast" x-show="toast" x-text="toast" x-transition></div>
</body>
</html>
